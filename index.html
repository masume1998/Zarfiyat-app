<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ظرفیت | دستیار تصمیم‌گیری مالی شخصی</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#001F3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ظرفیت">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap">
<style>
  :root{
    --ink:#001F3F; --ink-soft:#2C4A6B; --muted:#6E7C8C;
    --paper:#F6F7ED; --paper-deep:#EAECDD; --surface:#FFFFFF; --line:#DEE1D2;
    --safe:#00804C; --safe-soft:#E1F0E6; --safe-ink:#00603A;
    --caution:#8A7200; --caution-soft:#F7F3D2;
    --danger:#B3402A; --danger-soft:#F6E4DF;
    --accent:#DBE64C; --accent2:#1E488F; --green-bar:#74C365;
    --track:#E3E6D6;
    --shadow: 0 18px 40px -18px rgba(0,31,63,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--paper);
    min-height:100vh; min-height:100dvh;
    color:var(--ink);
  }
  ::selection{ background: var(--safe); color:#fff; }
  h1,h2,h3{ font-weight:800; letter-spacing:-.01em; }
  .num{ font-variant-numeric: tabular-nums; }
  .eyebrow{ font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:.03em; }

  .app{ display:flex; height:100vh; height:100dvh; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  .screens{ flex:1; position:relative; overflow:hidden; }
  .screen{ position:absolute; inset:0; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;
    padding:44px 20px 120px; opacity:0; visibility:hidden; transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease; }
  .screen::-webkit-scrollbar{ display:none; }
  .screen.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .page{ max-width:1040px; margin:0 auto; }
  .page-narrow{ max-width:640px; }

  @media (min-width:768px){
    .screen{ padding:64px 48px 120px; }
    .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .grid-2 .card + .card{ margin-top:0; }
    .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .grid-3 .card + .card{ margin-top:0; }
  }
  @media (max-width:767px){
    .grid-2, .grid-3{ display:block; }
  }

  .card{ background:var(--surface); border-radius:22px; padding:20px; border:none;
    box-shadow:0 1px 3px rgba(0,31,63,.05); }
  .card + .card{ margin-top:14px; }
  .section-title{ font-size:13px; font-weight:700; margin:26px 0 8px; display:flex; align-items:center; justify-content:space-between; }
  .section-title span.link{ font-size:12px; font-weight:600; color:var(--safe); cursor:pointer; }
  .muted{ color:var(--muted); }
  .hint{ font-size:11px; color:var(--muted); margin-top:5px; line-height:1.6; }
  .note{ display:flex; gap:10px; align-items:flex-start; background:transparent; border-radius:0;
    border-top:1px solid var(--line); padding:12px 2px; font-size:12.5px; line-height:1.8; color:var(--ink-soft); margin-bottom:14px; }
  .note .note-ic{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px;
    border-radius:100px; border:none; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--ink); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-sm{ padding:10px 16px; font-size:13px; width:auto; }
  .btn-outline-danger{ background:transparent; color:var(--danger); border:1px solid rgba(179,64,42,.35); }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  .field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .input, select.input, .date-field{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
  }
  .input:focus{ outline:2px solid var(--accent2); outline-offset:0; border-color:var(--accent2); }
  .row-2{ display:flex; gap:10px; } .row-2 > *{ flex:1; min-width:0; }
  .row-3{ display:flex; gap:8px; } .row-3 > *{ flex:1; min-width:0; }
  .mb6{ margin-bottom:6px; } .mb14{ margin-bottom:14px; } .mb18{ margin-bottom:18px; } .mb22{ margin-bottom:22px; }

  .chip{ padding:9px 14px; border-radius:100px; border:1px solid var(--line); background:var(--surface);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip.selected{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }

  .list-row{ display:flex; align-items:center; gap:12px; padding:13px 0; cursor:pointer; }
  .list-row + .list-row{ border-top:none; }
  .list-row .emoji-badge{ width:38px; height:38px; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .title{ font-size:13.5px; font-weight:700; }
  .list-row .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .list-row .amount{ font-size:13.5px; font-weight:800; }
  .cmt-row{ display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; }
  .cmt-thumb{ width:56px; height:72px; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:26px; flex:0 0 auto; }
  .cmt-row .info{ flex:1; min-width:0; }
  .cmt-row .title{ font-size:14px; font-weight:800; }
  .cmt-row .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .cmt-check{ width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:16px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .cmt-check:hover{ border-color:var(--safe); color:var(--safe); }
  .cmt-check.done{ background:var(--safe); border-color:var(--safe); color:#fff; cursor:default; }
  .list-section-title{ font-size:18px; font-weight:800; margin:22px 0 10px; }
  .inst-wrap.cmt-wrap{ margin:0 0 10px; border-radius:18px; }
  .inst-wrap.cmt-wrap .inst-card{ border:none; border-radius:18px; padding:12px;
    box-shadow:0 1px 3px rgba(0,31,63,.05); }
  /* ---- months slider on the dashboard ---- */
  .month-slider{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:2px 2px 12px; scrollbar-width:none; }
  .month-slider::-webkit-scrollbar{ display:none; }
  .month-card{ flex:0 0 138px; scroll-snap-align:start; background:var(--surface); border-radius:16px;
    padding:12px 14px; box-shadow:0 1px 3px rgba(0,31,63,.05); cursor:pointer; }
  .month-card.selected{ box-shadow:0 0 0 2px var(--ink); }
  .month-card .month-name{ font-size:12.5px; font-weight:800; }
  .month-card .month-amt{ font-size:14px; font-weight:800; margin-top:4px; }
  .month-card .month-pct{ font-size:11px; color:var(--muted); }
  .mini-bar{ height:6px; border-radius:100px; background:var(--track); overflow:hidden; margin:8px 0 6px; }
  .mini-bar > div{ height:100%; border-radius:100px; }
  /* ---- commitments: month groups as a card grid on wider screens ---- */
  .cmt-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
  .cmt-grid .inst-wrap, .cmt-grid .inst-wrap.cmt-wrap{ margin:0; }
  @media (min-width:768px){ .cmt-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (min-width:1100px){ .cmt-grid{ grid-template-columns:repeat(3, 1fr); } }
  .row-del, .row-edit{ width:26px; height:26px; border-radius:50%; background:var(--paper-deep); border:none;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; cursor:pointer; flex:0 0 auto;}

  .step-dots{ display:flex; gap:6px; margin-bottom:22px; justify-content:center; }
  .step-dots span{ width:26px; height:4px; border-radius:4px; background:var(--track); }
  .step-dots span.done{ background:var(--safe); }
  .step-dots span.now{ background:var(--ink); }
  .step-title{ font-size:20px; font-weight:800; margin-bottom:6px; }
  .step-sub{ font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.7; }
  .step-actions{ position:sticky; bottom:0; background:linear-gradient(0deg,var(--paper) 65%,transparent);
    padding-top:16px; display:flex; gap:10px; }

  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin:10px 0 2px; position:relative; }
  .gauge-figure{ position:relative; width:200px; }
  .gauge-figure svg{ width:100%; display:block; }
  .gauge-center{ position:absolute; left:0; right:0; bottom:4px; text-align:center; }
  .gauge-center .big{ font-size:24px; font-weight:800; }
  .gauge-center .small{ font-size:11px; color:var(--muted); }

  /* full-circle ring (new dashboard hero) */
  .ring-wrap{ position:relative; width:148px; height:148px; flex:0 0 auto; }
  .ring-wrap svg{ width:100%; height:100%; display:block; }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-center .big{ font-size:30px; font-weight:800; color:#fff; line-height:1.1; }
  .ring-center .small{ font-size:10.5px; color:rgba(255,255,255,.65); }

  .status-chip{ font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; display:inline-flex; align-items:center; gap:5px; }
  .status-chip.safe{ background:var(--safe-soft); color:var(--safe); }
  .status-chip.caution{ background:var(--caution-soft); color:var(--caution); }
  .status-chip.danger{ background:var(--danger-soft); color:var(--danger); }
  .status-chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  /* dark hero card */
  .hero{ background:var(--ink); border-radius:22px; padding:22px;
    color:#fff; border:none; }
  .hero .hero-label{ font-size:12.5px; color:rgba(255,255,255,.65); }
  .hero .hero-num{ font-size:34px; font-weight:800; color:var(--accent); line-height:1.25; }
  .hero .hero-sub{ font-size:12px; color:rgba(255,255,255,.65); line-height:1.7; }
  .hero .hero-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; font-size:12.5px; }
  .hero .hero-row .l{ color:rgba(255,255,255,.65); }
  .hero .hero-row .r{ font-weight:800; }
  .hero-chip{ font-size:11px; font-weight:700; padding:5px 12px; border-radius:100px; display:inline-flex; align-items:center; gap:6px; }
  .hero-chip.safe{ background:rgba(0,128,76,.9); color:#fff; }
  .hero-chip.caution{ background:var(--accent); color:var(--ink); }
  .hero-chip.danger{ background:#B3402A; color:#fff; }

  .month-strip{ display:flex; gap:9px; overflow-x:auto; padding-bottom:2px; }
  .month-pill{ flex:0 0 auto; width:92px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center; }
  .month-pill .mname{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .mbar{ height:6px; border-radius:100px; background:var(--track); overflow:hidden; margin-bottom:7px; }
  .mbar-fill{ height:100%; border-radius:100px; }
  .month-pill .mval{ font-size:11.5px; font-weight:700; }

  .segmented{ display:flex; background:var(--paper-deep); border-radius:100px; padding:3px; margin-bottom:18px; }
  .segmented button{ flex:1; border:none; background:transparent; padding:9px 6px; border-radius:100px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:0 2px 6px rgba(0,31,63,.1); }

  .waterfall-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; gap:10px; }
  .waterfall-row .l{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .waterfall-row .r{ font-size:14.5px; font-weight:800; text-align:left; }
  .waterfall-row.total{ border-top:2px solid var(--ink); margin-top:2px; }
  .waterfall-row.total .l{ font-size:14px; font-weight:800; color:var(--ink); }
  .waterfall-row.total .r{ font-size:17px; }
  .waterfall-arrow{ text-align:center; color:var(--line); font-size:12px; }

  /* budget allocation bars */
  .alloc-bar{ display:flex; height:8px; border-radius:100px; overflow:hidden; margin:14px 0 6px; }
  .alloc-bar > div{ height:100%; }
  .alloc-row{ display:flex; justify-content:space-between; gap:10px; padding:11px 0; font-size:13px; }
  .alloc-row .l{ display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink-soft); }
  .alloc-row .r{ font-weight:800; text-align:left; }
  .alloc-row.total{ border-top:2px solid var(--ink); }
  .alloc-row.total .l{ font-size:14px; font-weight:800; color:var(--ink); }
  .alloc-row.total .r{ font-size:16px; }
  .tbl-row.total{ border-top:2px solid var(--ink); }
  .tbl-row.total .c{ font-size:14px; font-weight:800; }
  .hero .hero-row.total{ border-top:2px solid rgba(255,255,255,.35); }
  .hero .hero-row.total .r{ font-size:15px; }
  .alloc-dot{ width:10px; height:10px; border-radius:3px; flex:0 0 auto; }

  /* bar chart (cashflow forecast) */
  .bars{ display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px; }
  .bars .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .bars .bar-val{ font-size:10.5px; font-weight:800; color:rgba(255,255,255,.85); }
  .bars .bar{ width:100%; max-width:38px; border-radius:6px 6px 0 0; background:var(--green-bar); }
  .bars .bar.last{ background:var(--accent); }
  .bars .bar-lab{ font-size:10.5px; color:rgba(255,255,255,.6); }

  /* simple table */
  .tbl{ width:100%; }
  .tbl .tbl-row{ display:flex; justify-content:space-between; gap:10px; padding:11px 2px; font-size:13px; }
  .tbl .tbl-row.head{ font-size:11.5px; color:var(--muted); font-weight:700; border-top:none; padding-top:0; }
  .tbl .tbl-row .c{ flex:1; }
  .tbl .tbl-row .c:first-child{ flex:1.35; }
  .tbl .tbl-row .c.l{ text-align:left; }

  /* calendar month grid */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-grid .wd{ font-size:11px; color:var(--muted); font-weight:700; padding:6px 0; }
  .cal-grid .day{ font-size:13.5px; font-weight:600; padding:9px 0 7px; border-radius:12px; cursor:pointer; position:relative; }
  .cal-grid .day .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent2); margin:3px auto 0; }
  .cal-grid .day .dot.paid{ background:var(--safe); }
  .cal-grid .day.sel{ background:var(--ink); color:#fff; }
  .cal-grid .day.sel .dot{ background:var(--accent); }
  .cal-grid .day.today{ outline:2px solid var(--accent2); }

  .cal-month-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .cal-month-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-month-head .name{ font-size:14.5px; font-weight:800; }
  .cal-due-row{ display:flex; justify-content:space-between; font-size:11.5px; padding:4px 0; color:var(--ink-soft); }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; }
  .filter-chip{ padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .filter-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{ position:absolute; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:100px; font-size:12px; font-weight:700;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.has-action{ display:flex; align-items:center; gap:14px; white-space:normal; max-width:calc(100% - 24px); }
  .toast.show.has-action{ pointer-events:auto; }
  .toast .toast-undo{ background:var(--accent); color:var(--ink); border:none; border-radius:100px; padding:6px 14px;
    font-family:inherit; font-size:12px; font-weight:800; cursor:pointer; flex:0 0 auto; }
  .toast .toast-undo:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .bottom-nav{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:20;
    width:min(430px, calc(100% - 32px));
    background:var(--ink); border-radius:100px; padding:10px 18px;
    box-shadow:0 16px 40px -12px rgba(0,31,63,.45);
    display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .bottom-nav .nav-btn{ color:rgba(255,255,255,.65); padding:10px 14px; border-radius:100px; }
  .bottom-nav .nav-btn.active{ background:var(--accent); color:var(--ink); }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:10px; font-weight:700; color:var(--muted); cursor:pointer; padding:6px 10px; }
  .nav-btn .nav-label{ display:none; }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active{ color:var(--safe-ink); background:var(--accent); border-radius:12px; }
  .nav-fab{ width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--ink); display:flex;
    align-items:center; justify-content:center; border:none; margin-top:-30px;
    box-shadow:0 8px 18px -6px rgba(219,230,76,.5); cursor:pointer; }
  .nav-fab svg{ width:22px; height:22px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .page-head{ margin-bottom:18px; }
  .page-head h1{ font-size:22px; }
  .page-head .sub{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
  .badge-necessity{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .badge-necessity.req{ background:var(--safe-soft); color:var(--safe); }
  .badge-necessity.semi{ background:var(--caution-soft); color:var(--caution); }
  .badge-necessity.optional{ background:var(--danger-soft); color:var(--danger); }
  .badge-channel{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--paper-deep); color:var(--ink-soft); }

  /* ---- installment rows: swipe-left to mark paid (reveal tracks --p = 0..1 drag progress) ---- */
  .inst-wrap{ position:relative; overflow:hidden; border-radius:12px; margin-top:6px; }
  .inst-reveal{ position:absolute; inset:0; display:flex; align-items:center; gap:8px; padding-inline-start:16px;
    background:var(--safe); color:#fff; font-size:12px; font-weight:800;
    opacity:calc(.35 + var(--p,0)*.65); }
  .inst-reveal .inst-check{ width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; border:2px solid #fff; font-size:13px; line-height:1;
    transform:scale(calc(.7 + var(--p,0)*.3)); opacity:calc(.3 + var(--p,0)*.7); }
  .inst-wrap.ready .inst-check{ background:#fff; color:var(--safe); }
  .inst-reveal .inst-label{ opacity:var(--p,0); }
  .inst-card{ position:relative; z-index:1; display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; }
  .inst-wrap.dragging .inst-card{ cursor:grabbing; }
  .inst-text{ flex:1; min-width:0; }
  .inst-title{ font-size:12.5px; font-weight:700; line-height:1.6; }
  .inst-amount{ font-size:12.5px; font-weight:800; white-space:nowrap; }

"use strict";

function jdiv(a,b){ return Math.trunc(a/b); }
function jmod(a,b){ return a - Math.trunc(a/b)*b; }
function g2d(gy,gm,gd){
  let d = jdiv((gy + jdiv(gm-8,6) + 100100)*1461,4) + jdiv(153*jmod(gm+9,12)+2,5) + gd - 34840408;
  d = d - jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4*jdn + 139361631;
  j = j + jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4 - 3908;
  const i = jdiv(jmod(j,1461),4)*5 + 308;
  const gd = jdiv(jmod(i,153),5) + 1;
  const gm = jmod(jdiv(i,153),12) + 1;
  const gy = jdiv(j,1461) - 100100 + jdiv(8-gm,6);
  return {gy,gm,gd};
}
function jalCal(jy){
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const gy = jy + 621;
  let leapJ = -14, jp = breaks[0], jump = 0;
  for(let i=1;i<breaks.length;i++){
    const jm = breaks[i];
    jump = jm - jp;
    if(jy < jm) break;
    leapJ = leapJ + jdiv(jump,33)*8 + jdiv(jmod(jump,33),4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + jdiv(n,33)*8 + jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33) === 4 && jump-n === 4) leapJ += 1;
  const leapG = jdiv(gy,4) - jdiv((jdiv(gy,100)+1)*3,4) - 150;
  const march = 20 + leapJ - leapG;
  if(jump - n < 6) n = n - jump + jdiv(jump+4,33)*33;
  let leap = jmod(jmod(n+1,33)-1,4);
  if(leap === -1) leap = 4;
  return {leap, gy, march};
}
function isLeapJalaali(jy){ return jalCal(jy).leap === 0; }
function j2d(jy,jm,jd){
  const r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - jdiv(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy;
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(gy,3,r.march);
  let k = jdn - jdn1f, jm, jd;
  if(k >= 0){
    if(k <= 185){ jm = 1 + jdiv(k,31); jd = jmod(k,31) + 1; return {jy,jm,jd}; }
    k -= 186;
  } else {
    jy -= 1; k += 179;
    if(jalCal(jy).leap === 1) k += 1;
  }
  jm = 7 + jdiv(k,30); jd = jmod(k,30) + 1;
  return {jy,jm,jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function jMonthLength(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaali(jy)?30:29; }
function jAddMonths(jy,jm,n){
  let total = (jy*12 + (jm-1)) + n;
  return { jy: Math.floor(total/12), jm: (total%12)+1 };
}
function jToday(){ const now = new Date(); return toJalaali(now.getFullYear(), now.getMonth()+1, now.getDate()); }

const MONTH_NAMES = ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function fmtJDate(j){ return `${fa(j.jd)} ${MONTH_NAMES[j.jm]} ${fa(j.jy)}`; }
function fmtJDateShort(j){ return `${fa(j.jd)} ${MONTH_NAMES[j.jm]}`; }
const WEEKDAY_NAMES = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function jWeekdayName(j){
  const g = toGregorian(j.jy, j.jm, j.jd);
  return WEEKDAY_NAMES[new Date(g.gy, g.gm - 1, g.gd).getDay()];
}

function fa(n){ return Math.round(n).toLocaleString('fa-IR'); }
function faM(n){ return fa(Math.round(n / 1000000)); } // میلیون تومان، برای جدول و نمودار جریان نقدی
function toman(n){ return fa(n) + ' تومان'; }
function parseFaDecimal(str){
  if(!str) return 0;
  const latin = String(str).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.');
  const m = latin.match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function parseFaNumber(str){
  if(!str) return 0;
  const digits = String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'');
  return parseInt(digits || '0', 10);
}

function attachAmountFormat(el){

    el.value = digits ? parseInt(digits,10).toLocaleString('fa-IR') : '';

}

function jalaliPickerHTML(prefix, j){
  const years = []; for(let y=j.jy-3; y<=j.jy+2; y++) years.push(y);
  return `<div class="row-3">

    </select>
    <select class="input" id="${prefix}-y">

}
// NOTE: these are scoped to a `root` element (not global document.getElementById).
// Reason: renderCommitmentForm() is reused in onboarding AND in the Commitments tab,
// both using the same id prefix ("cf-date"). Onboarding's markup is never removed from
// the DOM after it finishes, so a global lookup could silently grab the *stale* hidden
// onboarding picker instead of the visible one, leaving the visible days list empty.
function fillJalaliDays(root, prefix, keepDay){
  const y = parseInt(root.querySelector('#'+prefix+'-y').value,10);
  const m = parseInt(root.querySelector('#'+prefix+'-m').value,10);
  const len = jMonthLength(y,m);
  const daySel = root.querySelector('#'+prefix+'-d');
  const target = Math.min(keepDay || parseInt(daySel.value,10) || 1, len);
  daySel.innerHTML = Array.from({length:len},(_,i)=>i+1)
    .map(d=>`<option value="${d}" ${d===target?'selected':''}>${fa(d)}</option>`).join('');
}
function initJalaliPicker(root, prefix, j){
  fillJalaliDays(root, prefix, j.jd);
  root.querySelector('#'+prefix+'-y').addEventListener('change', ()=>fillJalaliDays(root, prefix));
  root.querySelector('#'+prefix+'-m').addEventListener('change', ()=>fillJalaliDays(root, prefix));
}
function readJalaliPicker(root, prefix){
  return {
    jy: parseInt(root.querySelector('#'+prefix+'-y').value,10),
    jm: parseInt(root.querySelector('#'+prefix+'-m').value,10),
    jd: parseInt(root.querySelector('#'+prefix+'-d').value,10)
  };
}

function migrateCommitment(c){
  if(!c.channel) c.channel = 'in_person';
  if(!Array.isArray(c.paidFlags)){
    const paidCount = typeof c.paid === 'number' ? c.paid : 0;
    c.paidFlags = Array.from({length:c.installments}, (_,i)=> i<paidCount);
  }
  if(c.paidFlags.length !== c.installments){
    const flags = Array.from({length:c.installments}, (_,i)=> !!c.paidFlags[i]);
    c.paidFlags = flags;
  }
  delete c.paid;
  // new sim model (v11): down payment + principal + interest amount/percent
  if(typeof c.downPayment !== 'number') c.downPayment = 0;
  if(typeof c.principal !== 'number') c.principal = Math.max(0, (c.total||0) - c.downPayment);
  if(!c.interestMode) c.interestMode = 'percent';
  if(typeof c.interestAmount !== 'number') c.interestAmount = Math.round((c.total||0) * (c.interestPercent||0) / 100);
  return c;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = Object.assign(defaultState(), JSON.parse(raw));
      state.commitments = (state.commitments||[]).map(migrateCommitment);
      if(!Array.isArray(state.savedProposals)) state.savedProposals = [];
    }
  }catch(e){ state = defaultState(); }
}

function scheduleEntryAt(purchaseJ, offset, ruleType, intervalDays, amount){
  if(ruleType === 'start_of_next_month'){
    const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, offset);
    return { jy:t.jy, jm:t.jm, jd:1, amount };
  }
  if(ruleType === 'monthly_fixed_day'){
    const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, offset);
    const day = Math.min(purchaseJ.jd, jMonthLength(t.jy,t.jm));
    return { jy:t.jy, jm:t.jm, jd:day, amount };
  }
  const step = ruleType === 'custom_interval' ? (intervalDays || 30) : 30;
  const jdn0 = j2d(purchaseJ.jy, purchaseJ.jm, purchaseJ.jd);
  const j = d2j(jdn0 + step*offset);
  return { jy:j.jy, jm:j.jm, jd:j.jd, amount };
}
function generateSchedule(purchaseJ, installments, perInstallment, ruleType, intervalDays, channel, platform){
  const entries = [];
  let count = installments;
  if(channel === 'online'){
    entries.push({ jy:purchaseJ.jy, jm:purchaseJ.jm, jd:purchaseJ.jd, amount:perInstallment });
    count = installments - 1;
    // SnapPay: خرید اینترنتی از ۱۶ تا آخر ماه → قسط اول موقع خرید پرداخت می‌شه و ماه بعد قسطی نیست
    const startOffset = (platform === 'snapppay' && purchaseJ.jd >= 16) ? 2 : 1;
    for(let p=0; p<count; p++){
      entries.push(scheduleEntryAt(purchaseJ, startOffset + p, ruleType, intervalDays, perInstallment));
    }
    return entries;
  }
  for(let p=0; p<count; p++){
    entries.push(scheduleEntryAt(purchaseJ, p+1, ruleType, intervalDays, perInstallment));
  }
  return entries;
}
function buildCommitmentSchedule(c){
  const sched = generateSchedule(c.purchaseDate, c.installments, c.monthly, c.scheduleType, c.intervalDays, c.channel, c.providerKey);
  return sched.map((e,i) => Object.assign({}, e, { paid: !!(c.paidFlags && c.paidFlags[i]), index:i }));
}

function reliableMonthlyIncome(){
  return state.incomeSources.filter(s=>s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function variableMonthlyIncome(){
  return state.incomeSources.filter(s=>!s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function totalFixedExpenses(){
  return state.fixedExpenses.reduce((sum,e)=>{
    const period = EXPENSE_PERIODS.find(p=>p.key===(e.period||'monthly'));
    return sum + e.amount * (period ? period.factor : 1);
  },0);
}
function cap(){ return Math.round(reliableMonthlyIncome() * state.installmentCapPercent / 100); }
function shareOfIncome(total){
  const incomeR = reliableMonthlyIncome();
  return incomeR > 0 ? (total / incomeR) * 100 : 0;
}
function statusFromShare(share){
  if(share >= state.thresholds.caution) return 'danger';
  if(share >= state.thresholds.safe) return 'caution';
  return 'safe';
}
/* kept for old call sites that pass a % of cap: converts to share first — do not use directly */
function statusFromPercent(pct){
  const c = cap();
  const incomeR = reliableMonthlyIncome();
  if(!c || !incomeR) return 'safe';
  return statusFromShare((pct / 100) * c / incomeR * 100);
}
function statusMeta(s){
  return { safe:{emoji:'🟢',label:'امن'}, caution:{emoji:'🟡',label:'احتیاط'}, danger:{emoji:'🔴',label:'فشار بالا'} }[s];
}
function statusColor(s){ return s==='safe' ? 'var(--safe)' : s==='caution' ? 'var(--caution)' : 'var(--danger)'; }
function allEntries(includePending){
  // A month's committed capacity is everything scheduled to be due in that month,
  // whether it's already been checked off as paid or not — paying it doesn't
  // shrink the month's obligation, it was still budgeted/spent from that month.
  const list = [];
  state.commitments.forEach(c=>{
    buildCommitmentSchedule(c).forEach(e=>{ list.push(e); });
  });
  if(includePending && state.pendingSimulation){
    generateSchedule(
      state.pendingSimulation.purchaseDate, state.pendingSimulation.installments,
      state.pendingSimulation.monthly, state.pendingSimulation.scheduleType,
      state.pendingSimulation.intervalDays, state.pendingSimulation.channel,
      state.pendingSimulation.providerKey
    ).forEach(e=>list.push(e));
  }
  return list;
}
function commitmentForMonth(jy,jm,includePending){
  return allEntries(includePending).filter(e=>e.jy===jy && e.jm===jm).reduce((s,e)=>s+e.amount,0);
}
function nextMonths(n){
  const t = jToday();
  const out = [];
  for(let i=0;i<n;i++){ out.push(jAddMonths(t.jy,t.jm,i)); }
  return out;
}
function dueSoonEntries(withinDays){
  const t = jToday();
  const todayJdn = j2d(t.jy,t.jm,t.jd);
  const list = [];
  state.commitments.forEach(c=>{
    buildCommitmentSchedule(c).forEach((e,i)=>{
      if(e.paid) return;
      const diff = j2d(e.jy,e.jm,e.jd) - todayJdn;
      if(diff>=0 && diff<=withinDays) list.push({ commitment:c, entry:e, index:i, diff });
    });
  });
  return list.sort((a,b)=>a.diff-b.diff);
}

function gaugeSVG(percent, trackColor, color){
  const p = Math.max(0, Math.min(100, percent));
  const r = 76, len = Math.PI*r;
  const offset = len * (1 - p/100);
  color = color || '#3FBE85';
  return `<svg viewBox="0 0 200 108">
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${trackColor}" stroke-width="13" stroke-linecap="round"/>
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${len}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}

/* Activity-rings style (Apple Watch Health): 3 concentric rings.
   Outer = installments vs cap (pct + status color passed in),
   middle = fixed expenses vs reliable income,
   inner = free cash vs reliable income. */
function ringSVG(pct, color){
  // One ring only: installments as % of the cap. Past 100% the ring is full and
  // the overflow draws a second lap in bright red, so the overage is visible.
  const R = 62, C = 2 * Math.PI * R;
  const main = Math.min(Math.max(pct, 0), 100) / 100 * C;
  const over = pct > 100 ? Math.min(pct - 100, 100) / 100 * C : 0;
  const dash = v => `${v.toFixed(1)} ${(C - v).toFixed(1)}`;
  return `<svg viewBox="0 0 148 148" role="img" aria-label="ظرفیت اقساط ${fa(Math.round(pct))} درصد">
    <circle cx="74" cy="74" r="${R}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/>
    <circle cx="74" cy="74" r="${R}" fill="none" stroke="${color || '#74C365'}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${dash(main)}" transform="rotate(-90 74 74)" style="transition:stroke-dasharray .5s ease"/>
    ${over > 0 ? `<circle cx="74" cy="74" r="${R}" fill="none" stroke="#FF5A4E" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${dash(over)}" transform="rotate(-90 74 74)"/>` : ''}
  </svg>`;
}
function requestNotifications(){
  if(!('Notification' in window)){ showToast('این مرورگر از نوتیفیکیشن پشتیبانی نمی‌کنه'); return; }
  Notification.requestPermission().then(perm=>{
    state.notificationsEnabled = perm === 'granted';
    saveState();
    showToast(perm==='granted' ? 'یادآوری اقساط فعال شد ✅' : 'اجازه داده نشد');
    renderProfile();
    checkDueNotifications();
  });
}
function checkDueNotifications(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const t = jToday();
  const key = NOTIF_KEY_PREFIX + j2d(t.jy,t.jm,t.jd);
  let already = [];
  try{ already = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
  // 5-day advance window, but no alarm ON the due date itself — only a heads-up beforehand
  dueSoonEntries(5).forEach(({commitment,entry,index,diff})=>{
    if(diff === 0) return;
    const flagId = commitment.id+'-'+index;
    if(already.includes(flagId)) return;
    try{
      new Notification('یادآوری قسط ظرفیت', {
        body: `${commitment.name}: ${toman(entry.amount)} تا ${fa(diff)} روز دیگه سررسید داره`
      });
    }catch(e){}
    already.push(flagId);
  });
  try{ localStorage.setItem(key, JSON.stringify(already)); }catch(e){}
}

/* =========================================================
   MARKING INSTALLMENTS PAID — swipe left / ✓ button / undo
   This is a manual self-report: it flips paidFlags[idx] in the real state and
   persists it. It does NOT verify any bank transaction.
========================================================= */
const swipeBusy = new Set();            // "cid:idx" currently animating out — repeated gestures are ignored
let lastMovedInstallment = null;        // lets the row animate into its new list after the re-render
const expandedCommitments = new Set();  // keeps expanded commitment cards open across re-renders
let homeMonthSel = 0;

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function refreshAfterPaidChange(){
  if(document.getElementById('screen-home').classList.contains('active')) renderHome();
  if(document.getElementById('screen-commitments').classList.contains('active')) renderCommitments();
}

// explicit set (never a blind toggle) so double triggers / late undo taps are harmless
function setPaid(commitmentId, idx, value, opts){
  opts = opts || {};
  const c = state.commitments.find(x=>x.id===commitmentId);
  if(!c || idx < 0 || idx >= c.installments) return false;   // commitment deleted/edited meanwhile
  if(!Array.isArray(c.paidFlags) || c.paidFlags.length !== c.installments){
    c.paidFlags = Array.from({length:c.installments}, (_,i)=> !!(c.paidFlags && c.paidFlags[i]));
  }
  if(!!c.paidFlags[idx] === value) return false;             // already in that state
  c.paidFlags[idx] = value;
  saveState();
  if(opts.moved) lastMovedInstallment = { cid: commitmentId, idx };
  refreshAfterPaidChange();
  if(value && opts.withUndo){
    showUndoToast('قسط به‌عنوان پرداخت‌شده علامت خورد', ()=> setPaid(commitmentId, idx, false, { moved:true }));
  } else {
    showToast(value ? 'قسط به‌عنوان پرداخت‌شده علامت خورد' : 'قسط به پرداخت‌نشده برگشت');
  }
  return true;
}

function installmentRowHTML(cid, idx, entry, opts){
  opts = opts || {};
  const paid = !!opts.paid;
  const label = opts.label || `قسط ${fa(idx+1)} — ${fmtJDate(entry)}`;
  const actionText = paid ? 'بازگردانی به پرداخت‌نشده' : 'علامت‌گذاری به‌عنوان پرداخت‌شده';
  return `<div class="inst-wrap ${paid?'is-paid':''}" role="listitem" data-cid="${cid}" data-idx="${idx}" ${paid?'':'data-swipe'}>
    ${paid ? '' : `<div class="inst-reveal" aria-hidden="true"><span class="inst-check">✓</span><span class="inst-label">پرداخت‌شده</span></div>`}
    <div class="inst-card">
      <div class="inst-text"><div class="inst-title">${label}</div></div>
      <div class="inst-amount num">${toman(entry.amount)}</div>
      <button type="button" class="inst-btn" data-action="${paid?'restore':'pay'}" title="${actionText}" aria-label="${actionText}: ${label}">${paid?'↩':'✓'}</button>
    </div>
  </div>`;
}

function completeSwipe(wrap, card, cid, idx){
  wrap._swiped = true;
  const key = cid+':'+idx;
  if(swipeBusy.has(key)) return;
  swipeBusy.add(key);
  const finish = ()=>{
    swipeBusy.delete(key);
    setPaid(cid, idx, true, { withUndo:true, moved:true });
  };
  if(prefersReducedMotion()){ finish(); return; }
  const h = wrap.offsetHeight;
  card.style.transition = 'transform .22s ease-in, opacity .22s ease-in';
  card.style.transform = `translateX(-${wrap.offsetWidth + 20}px)`;
  card.style.opacity = '0';
  setTimeout(()=>{                       // collapse the gap once the card has left
    wrap.style.maxHeight = h + 'px';
    void wrap.offsetHeight;
    wrap.style.transition = 'max-height .18s ease, margin .18s ease';
    wrap.style.maxHeight = '0px';
    wrap.style.marginTop = '0px';
  }, 200);
  setTimeout(finish, 400);
}

function attachSwipeHandlers(root){
  root.querySelectorAll('.inst-wrap[data-swipe]').forEach(wrap=>{
    if(wrap._swipeBound) return;
    wrap._swipeBound = true;
    const card = wrap.querySelector('.inst-card');
    const cid = wrap.dataset.cid, idx = parseInt(wrap.dataset.idx,10);
    let startX=0, startY=0, dx=0, tracking=false, locked=false, pid=null;
    // deliberately generous so short swipes / scrolling can't complete by accident
    const threshold = ()=> Math.max(80, Math.min(120, wrap.offsetWidth * 0.35));
    const paint = (p, ready)=>{
      wrap.style.setProperty('--p', p.toFixed(3));
      // interpolate surface (#fff) -> safe-soft (#E1F0E6) as the swipe progresses
      card.style.background = `rgb(${Math.round(255-30*p)},${Math.round(255-15*p)},${Math.round(255-25*p)})`;
      wrap.classList.toggle('ready', !!ready);
    };
    const resetCard = ()=>{
      card.style.transition = prefersReducedMotion() ? 'none' : 'transform .18s ease-out, background .18s ease-out';
      card.style.transform = '';
      paint(0, false);
      wrap.classList.remove('dragging');
    };
    card.addEventListener('pointerdown', e=>{
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      if(e.target.closest && e.target.closest('.inst-btn, .cmt-check')) return;   // the button has its own action
      if(swipeBusy.has(cid+':'+idx)) return;
      tracking = true; locked = false; dx = 0; pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e=>{
      if(!tracking || e.pointerId !== pid) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if(!locked){
        if(Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)){ tracking = false; return; }  // vertical scroll wins
        if(Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) * 1.5){
          locked = true; wrap.classList.add('dragging');
          try{ card.setPointerCapture(pid); }catch(_){}
        } else return;
      }
      dx = Math.min(0, mx);                       // only leftward movement is tracked
      const p = Math.min(1, Math.abs(dx) / threshold());
      card.style.transform = `translateX(${dx}px)`;
      paint(p, p >= 1);
    });
    const end = (e, cancelled)=>{
      if(!tracking || (e && e.pointerId !== pid)) return;
      tracking = false;
      try{ card.releasePointerCapture(pid); }catch(_){}
      if(!locked) return;                          // it was a tap or a vertical scroll — nothing to do
      const done = !cancelled && Math.abs(dx) >= threshold();
      locked = false; dx = 0;
      if(done) completeSwipe(wrap, card, cid, idx); else resetCard();
    };
    card.addEventListener('pointerup', e=>end(e, false));
    card.addEventListener('pointercancel', e=>end(e, true));
  });
}

// swipe handlers + the accessible ✓ / ↩ buttons for every installment row inside `root`
function wireInstallmentRows(root){
  attachSwipeHandlers(root);
  root.querySelectorAll('.inst-btn[data-action]').forEach(btn=>{
    if(btn._bound) return;
    btn._bound = true;
    btn.addEventListener('click', ev=>{
      ev.stopPropagation();
      const wrap = btn.closest('.inst-wrap');
      const cid = wrap.dataset.cid, idx = parseInt(wrap.dataset.idx,10);
      if(btn.dataset.action === 'pay') completeSwipe(wrap, wrap.querySelector('.inst-card'), cid, idx);
      else setPaid(cid, idx, false, { moved:true });
    });
  });
}

function animateMovedInstallment(root){
  if(!lastMovedInstallment) return;
  const { cid, idx } = lastMovedInstallment;
  lastMovedInstallment = null;
  if(prefersReducedMotion()) return;
  const el = root.querySelector(`.inst-wrap[data-cid="${cid}"][data-idx="${idx}"]`);
  if(el) el.classList.add('inst-enter');
}

function worstMonthStatus(monthsAhead){
  const c = cap();
  let worst = { pct:0, share:0, jy:0, jm:0, val:0 };
  nextMonths(monthsAhead || 6).forEach(m=>{
    const total = commitmentForMonth(m.jy, m.jm, false);
    const pct = c>0 ? (total/c)*100 : 0;
    const share = shareOfIncome(total);
    if(pct > worst.pct) worst = { pct, share, jy:m.jy, jm:m.jm, val: total };
  });
  return worst;
}

      <div id="inc-list"></div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-next">ادامه؛ هزینه‌های ثابت</button>
      </div>`;
    wireAmountInputs(el);

    let fixedSel = 1;
    el.querySelectorAll('[data-fixed]').forEach(c=>c.onclick=()=>{
      el.querySelectorAll('[data-fixed]').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); fixedSel = parseInt(c.dataset.fixed,10);
    });
    function renderIncList(){
      document.getElementById('inc-list').innerHTML = obDraft.incomeSources.map(s=>{
        const f = FREQUENCIES.find(x=>x.key===s.frequency);
        return `<div class="list-row">
          <div class="emoji-badge">${s.fixed?'✅':'🎲'}</div>
          <div class="info"><div class="title">${s.name}</div><div class="sub">${f.label} · ${s.fixed?'ثابت':'متغیر'}</div></div>
          <div class="amount num">${toman(s.amount)}</div>
          <button class="row-del" data-del="${s.id}">✕</button>
        </div>`;
      }).join('') || `<div class="muted" style="font-size:12.5px; text-align:center; padding:14px 0;">هنوز منبعی اضافه نکردی</div>`;
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        obDraft.incomeSources = obDraft.incomeSources.filter(s=>s.id!==b.dataset.del);
        renderIncList();
      });
    }
    renderIncList();
    document.getElementById('inc-add').onclick = ()=>{
      const name = document.getElementById('inc-name').value.trim();
      const amount = parseFaNumber(document.getElementById('inc-amount').value);
      const frequency = document.getElementById('inc-freq').value;
      if(!name || !amount){ showToast('نام و مبلغ رو وارد کن'); return; }
      obDraft.incomeSources.push({id:uid(), name, amount, frequency, fixed: fixedSel===1});
      document.getElementById('inc-name').value=''; document.getElementById('inc-amount').value='';
      renderIncList();
    };
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-next').onclick = ()=>{
      if(!obDraft.incomeSources.length){ showToast('حداقل یک منبع درآمد اضافه کن'); return; }
      obStep++; renderOnboarding();
    };
  }

  else if(obStep === 2){
    el.innerHTML = `${obDots()}
      <div class="step-title">اول، هزینه‌های همیشگی</div>
      <div class="step-sub">مخارج تکرارشونده به ما کمک می‌کنند پول باقی‌مانده را درست نشان دهیم. اقساط را در گام بعد اضافه کنید.</div>
      <div class="chip-grid mb18" id="fx-cats"></div>
      <div id="fx-list"></div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-next">ادامه؛ مرور اقساط و سقف</button>
      </div>`;
    document.getElementById('fx-cats').innerHTML = FIXED_CATEGORIES.map(c=>
      `<div class="chip" data-cat="${c.key}">${c.emoji} ${c.label}</div>`).join('');
    function renderFxList(){
      document.getElementById('fx-list').innerHTML = obDraft.fixedExpenses.map(e=>{
        const c = FIXED_CATEGORIES.find(x=>x.key===e.category);
        return `<div class="list-row" data-editfx="${e.id}">
          <div class="emoji-badge">${c.emoji}</div>
          <div class="info"><div class="title">${c.label}</div></div>
          <div class="amount num">${toman(e.amount)}</div>
          <button class="row-del" data-delfx="${e.id}">✕</button>
        </div>`;
      }).join('') || `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0 14px;">هنوز هزینه‌ای اضافه نکردی</div>`;
      document.querySelectorAll('[data-delfx]').forEach(b=>b.onclick=(ev)=>{
        ev.stopPropagation();
        obDraft.fixedExpenses = obDraft.fixedExpenses.filter(x=>x.id!==b.dataset.delfx);
        renderFxList();
      });
      document.querySelectorAll('[data-editfx]').forEach(row=>row.addEventListener('click', ()=>{
        const item = obDraft.fixedExpenses.find(x=>x.id===row.dataset.editfx);
        const amountStr = prompt('مبلغ ماهانه جدید (تومان):', item.amount);
        if(amountStr===null) return;
        const amount = parseFaNumber(amountStr);
        if(!amount) return;
        item.amount = amount;
        renderFxList();
      }));
    }
    renderFxList();
    document.querySelectorAll('[data-cat]').forEach(chip=>{
      chip.onclick = ()=>{
        const amountStr = prompt(`مبلغ ماهانه‌ی «${chip.textContent.trim()}» (تومان، مثلاً ۲٬۵۰۰٬۰۰۰):`);
        if(amountStr === null) return;
        const amount = parseFaNumber(amountStr);
        if(!amount) return;
        obDraft.fixedExpenses.push({id:uid(), category: chip.dataset.cat, amount});
        renderFxList();
      };
    });
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-next').onclick = ()=>{ obStep++; renderOnboarding(); };
  }

  else if(obStep === 3){
    const reliable = obDraft.incomeSources.filter(s=>s.fixed).reduce((s,x)=>{
      const f = FREQUENCIES.find(y=>y.key===x.frequency); return s + x.amount*(f?f.factor:1);
    },0);
    el.innerHTML = `${obDots()}
      <div class="step-title">یک مرز روشن برای خرید</div>
      <div class="step-sub">سقف پیشنهادی بر اساس درآمد قابل‌اتکای شماست؛ خودت می‌تونی تغییرش بدی.</div>
      <div class="hero mb18">
        <div class="hero-label">سقف پیشنهادی اقساط ماهانه</div>
        <div class="hero-num num" id="ob-cap-amount">${toman(reliable * obDraft.capPercent / 100)}</div>
        <div class="hero-sub">پایه محاسبه: ${toman(reliable)} · <span id="ob-cap-pct">${fa(obDraft.capPercent)}٪</span> از درآمد قابل‌اتکا</div>
        <input type="range" min="10" max="70" step="5" value="${obDraft.capPercent}" id="ob-cap-slider" style="margin-top:14px;">
        <div class="hero-sub" style="margin-top:8px;">درصد سقف دلخواه</div>
      </div>
      <button type="button" class="card mb18" id="ob-add-cm" style="display:flex; align-items:center; gap:12px; padding:16px; width:100%; text-align:start; cursor:pointer; border:none; font-family:inherit; color:inherit;">
        <span style="width:48px; height:48px; border-radius:14px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:0 0 48px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="3" stroke="#001F3F" stroke-width="1.8"/><path d="M16 2v4M8 2v4M3 10h18" stroke="#001F3F" stroke-width="1.8" stroke-linecap="round"/><path d="m9 16 2 2 4-4" stroke="#001F3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span style="flex:1; min-width:0;">
          <span style="display:block; font-size:15px; font-weight:800;">اقساط فعلیت رو ثبت کن</span>
          <span class="muted" style="display:block; font-size:12px; margin-top:2px;">قسط، وام یا بدهی — تا ظرفیتت درست حساب بشه</span>
        </span>
        <span style="font-size:14px; font-weight:800; color:var(--safe); flex:0 0 auto;">+ افزودن</span>
      </button>
      <div class="card mb18" id="cm-form" style="display:none;"></div>
      <div id="cm-list"></div>
      <div class="note"><span class="note-ic">ⓘ</span><span>وضعیت از نسبت اقساط به درآمد تعیین می‌شود: امن، کمتر از ۳۰٪؛ احتیاط، ۳۰ تا کمتر از ۴۰٪؛ فشار بالا، ۴۰٪ و بیشتر.</span></div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-finish">ورود به داشبورد من</button>
      </div>`;
    function updateObCap(){
      document.getElementById('ob-cap-amount').textContent = toman(reliable * obDraft.capPercent / 100);
      document.getElementById('ob-cap-pct').textContent = fa(obDraft.capPercent) + '٪';
    }
    document.getElementById('ob-cap-slider').addEventListener('input', e=>{
      obDraft.capPercent = parseInt(e.target.value,10); updateObCap();
    });
    function renderCmList(){
      document.getElementById('cm-list').innerHTML = obDraft.commitments.map(c=>{
        const t = COMMITMENT_TYPES.find(x=>x.key===c.type);
        const paidCount = c.paidFlags.filter(Boolean).length;
        return `<div class="list-row">
          <div class="emoji-badge">${t.emoji}</div>
          <div class="info"><div class="title">${c.name}</div><div class="sub">${fa(paidCount)}/${fa(c.installments)} قسط · ${toman(c.monthly)}</div></div>
          <button class="row-del" data-del="${c.id}">✕</button>
        </div>`;
      }).join('') || `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0 14px;">هنوز تعهدی اضافه نکردی</div>`;
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        obDraft.commitments = obDraft.commitments.filter(x=>x.id!==b.dataset.del);
        renderCmList();
      });
    }
    renderCmList();
    document.getElementById('ob-add-cm').onclick = ()=>{
      const form = document.getElementById('cm-form');
      if(form.style.display === 'none'){
        form.style.display = 'block';
        renderCommitmentForm(form, null, (c)=>{
          obDraft.commitments.unshift(c); renderCmList();
          form.style.display = 'none'; form.innerHTML = '';
        });
      } else {
        form.style.display = 'none'; form.innerHTML = '';
      }
    };
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-finish').onclick = ()=>{
      state.incomeSources = obDraft.incomeSources;
      state.fixedExpenses = obDraft.fixedExpenses;
      state.technique = obDraft.technique;
      state.installmentCapPercent = obDraft.capPercent;
      state.thresholds = obDraft.thresholds;
      state.commitments = obDraft.commitments;
      state.onboarded = true;
      saveState();
      document.getElementById('bottom-nav').style.display = 'flex';
      goTo('home');
    };
  }
}

function renderCommitmentForm(container, existing, onSave){
  const isEdit = !!existing;
  const today = jToday();
  const startDate = isEdit ? existing.purchaseDate : today;
  container.innerHTML = `
    <div class="field-label">نام تعهد</div>
    <input class="input mb14" id="cf-name" placeholder="مثلاً گوشی، وام بانک، چک اجاره" value="${isEdit?existing.name:''}">
    <div class="field-label">نوع</div>
    <div class="chip-grid mb14" id="cf-types">
      ${COMMITMENT_TYPES.map(t=>`<div class="chip ${isEdit&&existing.type===t.key?'selected':''}" data-type="${t.key}">${t.emoji} ${t.label}</div>`).join('')}
    </div>
    <div class="row-2 mb14">
      <div><div class="field-label">مبلغ کل (تومان)</div><input class="input amt-input num" id="cf-total" inputmode="numeric" placeholder="مثلاً ۴٬۰۰۰٬۰۰۰" value="${isEdit?fa(existing.total):''}"></div>
      <div><div class="field-label">تعداد اقساط</div><input class="input num" id="cf-installments" type="number" min="1" value="${isEdit?existing.installments:4}" placeholder="مثلاً ۴"></div>
    </div>
    <div class="field-label">مبلغ هر قسط (تومان)</div>
    <input class="input amt-input num mb6" id="cf-per-installment" inputmode="numeric" placeholder="اگه کل مبلغ رو نمی‌دونی، فقط همینو پر کن">
    <div class="hint mb14">هر کدوم از این دو مبلغ (کل یا هر قسط) رو که بدونی کافیه؛ اون یکی خودش حساب می‌شه</div>
    <div id="cf-down-wrap">
      <div class="field-label">پیش‌پرداخت (تومان)</div>
      <input class="input amt-input num mb6" id="cf-down" inputmode="numeric" placeholder="مثلاً ۶۰۰٬۰۰۰" value="${isEdit&&existing.downPayment?fa(existing.downPayment):''}">
      <div class="hint mb14">فقط دیجی‌پی پیش‌پرداخت می‌گیره؛ از مبلغی که قسط‌بندی می‌شه کم می‌شه</div>
    </div>
    <div class="field-label">سود</div>
    <div class="chip-grid mb14" id="cf-interest-mode">
      <div class="chip ${(isEdit?existing.interestMode:'amount')==='amount'?'selected':''}" data-imode="amount">مبلغ سود</div>
      <div class="chip ${(isEdit?existing.interestMode:'amount')==='percent'?'selected':''}" data-imode="percent">سود درصدی</div>
    </div>
    <div class="row-2 mb14">
      <div><div class="field-label" id="cf-interest-label">${(isEdit?existing.interestMode:'amount')==='percent'?'سود (٪)':'مبلغ سود کل دوره (تومان)'}</div><input class="input num" id="cf-interest" inputmode="decimal" placeholder="مثلاً ۱۸" value="${isEdit?((existing.interestMode==='percent'?existing.interestPercent:(existing.interestAmount||''))):''}"></div>
      <div><div class="field-label">کارمزد ثابت (تومان)</div><input class="input amt-input num" id="cf-fee" inputmode="numeric" placeholder="مثلاً ۵۰۰٬۰۰۰" value="${isEdit&&existing.fee?fa(existing.fee):''}"></div>
    </div>
    <div class="hint mb14" id="cf-interest-preview">این دو تا (سود درصدی + کارمزد ثابت) به کل بدهی اضافه و روی قسط‌ها پخش می‌شن — برای وام/قرض معمولاً سود بانکیه، برای بقیه هر کارمزدی که سرویس می‌گیره</div>
    <div id="cf-channel-section">
      <div class="field-label">نحوه خرید</div>
      <div class="chip-grid mb14" id="cf-channel">
        ${CHANNELS.map(ch=>`<div class="chip ${(isEdit?existing.channel:'in_person')===ch.key?'selected':''}" data-channel="${ch.key}">${ch.label}</div>`).join('')}
      </div>
      <div class="hint mb14" id="cf-channel-hint"></div>
    </div>
    ${!isEdit ? `
    <div class="field-label">چند قسط قبلاً پرداخت شده؟</div>
    <input class="input num mb14" id="cf-paid" type="number" min="0" value="0" placeholder="مثلاً ۰">
    <div class="hint mb14">اگه این تعهد از قبل شروع شده و چند قسطش رو دادی، اینجا وارد کن</div>` : ''}
    <div class="field-label">تاریخ خرید/شروع</div>
    ${jalaliPickerHTML('cf-date', startDate)}
    <div class="mb14"></div>
    <div class="field-label">پلتفرم / سرویس</div>
    <select class="input mb14" id="cf-provider">
      ${PROVIDERS.map(p=>`<option value="${p.key}" ${isEdit&&existing.providerKey===p.key?'selected':''}>${p.label}</option>`).join('')}
    </select>
    <div class="field-label">نوع زمان‌بندی اقساط</div>
    <select class="input mb14" id="cf-scheduletype">
      ${Object.keys(SCHEDULE_LABELS).map(k=>`<option value="${k}" ${isEdit&&existing.scheduleType===k?'selected':''}>${SCHEDULE_LABELS[k]}</option>`).join('')}
    </select>
    <div class="hint mb14">پلتفرم فقط برای شناسایی خودته؛ زمان‌بندی واقعی رو خودت جدا مشخص می‌کنی — چون ممکنه دو خرید از یه پلتفرم، قانون پرداخت متفاوتی داشته باشن</div>
    <div id="cf-interval-wrap" style="display:none;" class="mb14">
      <div class="field-label">فاصله بین اقساط (روز)</div>
      <input class="input num" id="cf-interval" type="number" value="${isEdit?(existing.intervalDays||30):30}" placeholder="مثلاً ۳۰">
    </div>
    <div class="field-label">ضرورت</div>
    <div class="chip-grid mb14" id="cf-necessity">
      ${NECESSITY.map(n=>`<div class="chip ${(isEdit?existing.necessity:'req')===n.key?'selected':''}" data-nec="${n.key}">${n.label}</div>`).join('')}
    </div>
    <button class="btn ${isEdit?'btn-primary':'btn-ghost'}" id="cf-add">${isEdit?'ذخیره تغییرات':'+ افزودن تعهد'}</button>
  `;
  wireAmountInputs(container);
  initJalaliPicker(container, 'cf-date', startDate);

  let selType = isEdit ? existing.type : 'bnpl';
  let selNec = isEdit ? existing.necessity : 'req';
  let selChannel = isEdit ? existing.channel : 'in_person';

  // channel (online/in-person) only makes sense for purchase-like commitments;
  // loans/debts/checks/personal debt don't have an "upfront installment" concept.
  // Platform, schedule rule, and fee are otherwise fully independent choices —
  // picking a platform just pre-fills a sensible schedule default, it doesn't lock it.
  const CHANNEL_LESS_TYPES = ['loan','debt','personal','check'];
  function updateTypeDependentSections(){
    const channelSection = container.querySelector('#cf-channel-section');
    channelSection.style.display = CHANNEL_LESS_TYPES.includes(selType) ? 'none' : 'block';
    if(CHANNEL_LESS_TYPES.includes(selType)) selChannel = 'in_person';
  }

  function updateChannelHint(){
    const ch = CHANNELS.find(c=>c.key===selChannel);
    let hint = ch.hint;
    try{
      const pd = readJalaliPicker(container, 'cf-date');
      const pk = container.querySelector('#cf-provider').value;
      if(selChannel==='online' && pk==='snapppay' && pd.jd >= 16){
        hint = 'قسط اول موقع خرید پرداخت می‌شه و ماه بعد قسطی نداری.';
      }
    }catch(e){}
    container.querySelector('#cf-channel-hint').textContent = hint;
  }
  function updateDownVisibility(){
    const pk = container.querySelector('#cf-provider').value;
    container.querySelector('#cf-down-wrap').style.display = pk==='digipay' ? 'block' : 'none';
  }
  updateChannelHint();
  updateDownVisibility();
  updateTypeDependentSections();
  ['cf-date-d','cf-date-m','cf-date-y'].forEach(id=>{
    container.querySelector('#'+id).addEventListener('change', updateChannelHint);
  });

  // total <-> per-installment amount: whichever the person fills in, compute the other
  const totalEl = container.querySelector('#cf-total');
  const perEl = container.querySelector('#cf-per-installment');
  const installmentsEl = container.querySelector('#cf-installments');
  if(isEdit) perEl.value = fa(existing.monthly);
  totalEl.addEventListener('input', ()=>{
    const total = parseFaNumber(totalEl.value);
    const n = Math.max(1, parseInt(installmentsEl.value,10) || 1);
    if(total) perEl.value = fa(Math.round(total/n));
  });
  perEl.addEventListener('input', ()=>{
    const per = parseFaNumber(perEl.value);
    const n = Math.max(1, parseInt(installmentsEl.value,10) || 1);
    if(per) totalEl.value = fa(per*n);
  });
  installmentsEl.addEventListener('input', ()=>{
    const n = Math.max(1, parseInt(installmentsEl.value,10) || 1);
    const total = parseFaNumber(totalEl.value);
    if(total){ perEl.value = fa(Math.round(total/n)); }
    else{
      const per = parseFaNumber(perEl.value);
      if(per) totalEl.value = fa(per*n);
    }
    updateInterestPreview();
  });

  const interestEl = container.querySelector('#cf-interest');
  const feeEl = container.querySelector('#cf-fee');
  const downEl = container.querySelector('#cf-down');
  let selImode = isEdit ? (existing.interestMode || 'amount') : 'amount';
  function updateInterestPreview(){
    const total = parseFaNumber(totalEl.value) || (parseFaNumber(perEl.value) * Math.max(1, parseInt(installmentsEl.value,10)||1));
    const pk = container.querySelector('#cf-provider').value;
    const down = pk==='digipay' ? parseFaNumber(downEl.value) : (isEdit ? (existing.downPayment||0) : 0);
    const principal = Math.max(0, total - down);
    const n = Math.max(1, parseInt(installmentsEl.value,10) || 1);
    const fee = parseFaNumber(feeEl.value);
    const interestAmount = selImode === 'amount' ? parseFaNumber(interestEl.value) : Math.round(principal * parseFaDecimal(interestEl.value) / 100);
    const finalMonthly = total ? Math.round((principal + interestAmount + fee) / n) : 0;
    container.querySelector('#cf-interest-preview').textContent = total
      ? `قسط نهایی با احتساب سود و کارمزد: ${toman(finalMonthly)}${interestAmount||fee ? ` (سود: ${toman(interestAmount)}، کارمزد: ${toman(fee)})` : ''}`
      : 'این دو تا (سود + کارمزد) به مبلغی که قسط‌بندی می‌شه اضافه و روی قسط‌ها پخش می‌شن';
  }
  totalEl.addEventListener('input', updateInterestPreview);
  perEl.addEventListener('input', updateInterestPreview);
  downEl.addEventListener('input', updateInterestPreview);
  interestEl.addEventListener('input', updateInterestPreview);
  feeEl.addEventListener('input', updateInterestPreview);
  updateInterestPreview();
  container.querySelectorAll('[data-imode]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-imode]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selImode = c.dataset.imode;
    container.querySelector('#cf-interest-label').textContent = selImode === 'amount' ? 'مبلغ سود کل دوره (تومان)' : 'سود (٪)';
    interestEl.value = '';
    interestEl.placeholder = selImode === 'amount' ? 'مثلاً ۵۰۰٬۰۰۰' : 'مثلاً ۱۸';
    updateInterestPreview();
  });

  container.querySelectorAll('[data-type]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selType = c.dataset.type;
    updateTypeDependentSections();
  });
  container.querySelectorAll('[data-nec]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-nec]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selNec = c.dataset.nec;
  });
  container.querySelectorAll('[data-channel]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-channel]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selChannel = c.dataset.channel;
    updateChannelHint();
  });
  container.querySelector('#cf-provider').addEventListener('change', e=>{

    container.querySelector('#cf-interval-wrap').style.display =
      container.querySelector('#cf-scheduletype').value==='custom_interval' ? 'block':'none';

  });

    let total = parseFaNumber(container.querySelector('#cf-total').value);
    const perInstallment = parseFaNumber(container.querySelector('#cf-per-installment').value);
    if(!total && perInstallment) total = perInstallment * installments; // only knew the per-installment amount
    const providerKey0 = container.querySelector('#cf-provider').value;
    const down = providerKey0==='digipay' ? parseFaNumber(container.querySelector('#cf-down').value) : (isEdit ? (existing.downPayment||0) : 0);
    const principal = Math.max(0, total - down);
    const fee = parseFaNumber(container.querySelector('#cf-fee').value);
    const interestAmount = selImode === 'amount' ? parseFaNumber(container.querySelector('#cf-interest').value) : Math.round(principal * parseFaDecimal(container.querySelector('#cf-interest').value) / 100);
    const interestPercent = selImode === 'percent' ? parseFaDecimal(container.querySelector('#cf-interest').value) : (principal > 0 ? Math.round(interestAmount / principal * 1000) / 10 : 0);
    const providerKey = container.querySelector('#cf-provider').value;
    const provider = PROVIDERS.find(p=>p.key===providerKey);
    const scheduleType = container.querySelector('#cf-scheduletype').value;
    const interval = parseInt(container.querySelector('#cf-interval').value,10) || 30;
    const purchaseDate = readJalaliPicker(container, 'cf-date');
    if(!name || !total){ showToast('نام رو و حداقل یکی از دو مبلغ (کل یا هر قسط) رو وارد کن'); return; }
    const monthly = Math.round((principal + interestAmount + fee) / installments);

    let paidFlags;
    if(isEdit){
      paidFlags = existing.paidFlags.length===installments
        ? existing.paidFlags
        : Array.from({length:installments}, (_,i)=> !!existing.paidFlags[i]);
    } else {
      const paidCount = Math.min(parseInt(container.querySelector('#cf-paid').value,10) || 0, installments);
      paidFlags = Array.from({length:installments}, (_,i)=> i<paidCount);
      if(selChannel==='online' && installments>0) paidFlags[0] = true;
    }

    onSave({
      id: isEdit ? existing.id : uid(), name, type: selType, total, downPayment: down, principal,
      interestMode: selImode, interestPercent, interestAmount, fee, installments, monthly,
      provider: provider.label, providerKey: provider.key, scheduleType, intervalDays: interval,
      purchaseDate, necessity: selNec, channel: selChannel, paidFlags
    });
  };
}

/* ---- Monthly analysis: short, rule-based, local-only ----
   One card on Home: this month vs cap, free cash, heaviest month
   in the next 6, biggest installment this month, paid count, one tip. */
function buildMonthlyAnalysis(){
  const t = jToday();
  const c = cap();
  const incomeR = reliableMonthlyIncome();
  const incomeT = incomeR + variableMonthlyIncome();
  const fixed = totalFixedExpenses();
  const savingsPct = (state.technique && state.technique.p && typeof state.technique.p.savings === 'number') ? state.technique.p.savings : 20;
  const savings = Math.round(incomeR * savingsPct / 100);
  const total = commitmentForMonth(t.jy, t.jm, false);
  const pct = c > 0 ? (total / c) * 100 : 0;
  const share = shareOfIncome(total);
  const status = statusFromShare(share);
  const free = incomeT - fixed - savings - total;
  const moneyLeft = incomeR - fixed - total;
  let worst = { pct:0, share:0, jy:t.jy, jm:t.jm, val:0 };
  nextMonths(6).forEach(m=>{
    const v = commitmentForMonth(m.jy, m.jm, false);
    const pp = c > 0 ? (v / c) * 100 : 0;
    if(pp > worst.pct) worst = { pct:pp, share:shareOfIncome(v), jy:m.jy, jm:m.jm, val:v };
  });
  let biggest = null, dueCount = 0, paidCount = 0;
  state.commitments.forEach(cm=>{
    buildCommitmentSchedule(cm).forEach(e=>{
      if(e.jy === t.jy && e.jm === t.jm){
        dueCount++;
        if(e.paid) paidCount++;
        if(!biggest || e.amount > biggest.amount) biggest = { name: cm.name, amount: e.amount };
      }
    });
  });
  let tip = '';
  if(!incomeR) tip = 'اول درآمد رو توی پروفایل وارد کن.';
  else if(!state.commitments.length) tip = 'هنوز قسطی نداری — با + یه خرید رو بررسی کن.';
  else if(free < 0) tip = 'پول آزاد منفیه — خرید جدید نخر.';
  else if(status === 'danger') tip = `${MONTH_NAMES[worst.jm]} سنگین‌ترین ماهه — خرید جدید رو عقب بنداز.`;
  else if(status === 'caution') tip = 'این ماه رو با احتیاط بگذرون.';
  else tip = 'این ماه جا داری.';
  return { t, c, total, pct, share, status, free, moneyLeft, worst, biggest, dueCount, paidCount, tip };
}

        <button class="btn btn-ghost" id="cm-edit" style="max-width:110px;">ویرایش</button>
        <button class="btn btn-outline-danger" id="cm-del" style="max-width:110px;">حذف</button>
      </div>
    `;
    document.getElementById('cm-back').onclick = ()=>{ commitDetailTarget=null; renderCommitments(); };
    document.getElementById('cm-back2').onclick = ()=>{ commitDetailTarget=null; renderCommitments(); };
    document.getElementById('cm-edit').onclick = ()=>{ commitEditTarget = cm; commitDetailTarget = null; renderCommitments(); };
    document.getElementById('cm-del').onclick = ()=>{
      if(!confirm('این تعهد حذف بشه؟')) return;
      state.commitments = state.commitments.filter(x=>x.id!==cm.id);
      saveState(); commitDetailTarget = null; renderCommitments();
    };
    const markBtn = document.getElementById('cm-mark-next');
    if(markBtn) markBtn.onclick = ()=> setPaid(cm.id, nextIdx, true);
    wireInstallmentRows(el);
    animateMovedInstallment(el);
    document.getElementById('screen-commitments').scrollTop = prevScroll;
    return;
  }

  const t = jToday();
  const todayJdn = j2d(t.jy, t.jm, t.jd);

  // Every installment from today onward, grouped by month; overdue unpaid
  // installments collect under «عقب‌افتاده» so nothing due ever disappears.
  const entries = [];
  state.commitments.forEach(cm=>{
    const schedule = buildCommitmentSchedule(cm);
    schedule.forEach((e, idx)=>{
      const past = j2d(e.jy, e.jm, e.jd) < todayJdn;
      if(past && e.paid) return;
      entries.push({ cm, idx, entry: e, hasUnpaid: !e.paid,
        groupKey: past ? 'overdue' : `${e.jy}-${e.jm}`,
        groupTitle: past ? 'عقب‌افتاده' : `${MONTH_NAMES[e.jm]} ${fa(e.jy)}`,
        groupOrder: past ? -1 : e.jy * 12 + e.jm,
        jdn: j2d(e.jy, e.jm, e.jd) });
    });
  });
  entries.sort((a,b)=> a.groupOrder - b.groupOrder || a.jdn - b.jdn);

  const shown = commitMonthOffset === 0
    ? entries.filter(d=> d.groupKey === 'overdue' || d.groupKey === `${t.jy}-${t.jm}`)
    : entries;

  const filtered = shown.filter(d=>{
    if(commitFilter==='unpaid') return d.hasUnpaid;
    if(commitFilter==='paid') return !d.hasUnpaid;
    return true;
  });
  const groups = [];
  filtered.forEach(d=>{
    const g = groups.find(x=>x.key===d.groupKey);
    if(g) g.rows.push(d); else groups.push({ key:d.groupKey, title:d.groupTitle, rows:[d] });
  });
  const rowHTML = d=>{
    const cm = d.cm;
    const typeInfo = COMMITMENT_TYPES.find(x=>x.key===cm.type);
    const inner = `<div class="cmt-row inst-card" data-detail="${cm.id}">
      <div class="cmt-thumb">${d.hasUnpaid?typeInfo.emoji:'✅'}</div>
      <div class="info">
        <div class="title">${cm.name}</div>
        <div class="sub">${cm.provider} · قسط ${fa(d.idx+1)} از ${fa(cm.installments)}</div>
        <div class="sub">سررسید ${fmtJDate(d.entry)} · ${toman(cm.monthly)}</div>
      </div>
      <button class="cmt-check ${d.hasUnpaid?'':'done'}" data-check="${cm.id}" data-idx="${d.idx}" ${d.hasUnpaid?'':'disabled'}
        title="${d.hasUnpaid?'علامت‌گذاری این قسط به‌عنوان پرداخت‌شده':'پرداخت‌شده'}">✓</button>
    </div>`;
    if(!d.hasUnpaid) return `<div class="inst-wrap cmt-wrap is-paid" role="listitem">${inner}</div>`;
    return `<div class="inst-wrap cmt-wrap" role="listitem" data-cid="${cm.id}" data-idx="${d.idx}" data-swipe>
      <div class="inst-reveal" aria-hidden="true"><span class="inst-check">✓</span><span class="inst-label">پرداخت شد</span></div>
      ${inner}
    </div>`;
  };

  el.innerHTML = `
    <div class="page-head" style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
      <button class="icon-btn" id="cm-month-toggle" aria-label="نمایش ماه‌های آینده" title="ماه‌های آینده" style="${commitMonthOffset===1?'border-color:var(--ink); box-shadow:0 0 0 2px var(--ink);':''}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="3" stroke="#001F3F" stroke-width="1.8"/><path d="M16 2v4M8 2v4M3 10h18" stroke="#001F3F" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div style="flex:1; text-align:center;">
        <h1>اقساط من</h1>
        <div class="sub">${commitMonthOffset===0 ? `${MONTH_NAMES[t.jm]} ${fa(t.jy)}` : `${MONTH_NAMES[t.jm]} ${fa(t.jy)} به بعد`} · ${fa(shown.length)} قسط</div>
      </div>
      <button class="icon-btn" id="cm-new" aria-label="افزودن قسط یا تعهد" title="افزودن قسط یا تعهد">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#001F3F" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="filter-row" id="commit-filters">
      <div class="filter-chip ${commitFilter==='all'?'selected':''}" data-f="all">همه</div>
      <div class="filter-chip ${commitFilter==='unpaid'?'selected':''}" data-f="unpaid">پرداخت‌نشده</div>
      <div class="filter-chip ${commitFilter==='paid'?'selected':''}" data-f="paid">پرداخت‌شده</div>
    </div>
    ${groups.length ? groups.map(g=>`
      <div class="list-section-title">${g.title} · ${fa(g.rows.length)} قسط</div>
      <div class="cmt-grid mb18">${g.rows.map(rowHTML).join('')}</div>`).join('') : ''}
    ${!filtered.length ? `<div class="muted" style="text-align:center; padding:40px 0; font-size:13px;">${shown.length===0 ? (commitMonthOffset===0 ? `قسطی در ${MONTH_NAMES[t.jm]} نداری` : 'قسطی نداری') : 'تعهدی در این دسته نیست'}</div>` : ''}
    <div class="hint" style="margin-top:14px;">برای ثبت پرداخت، روی ✓ کنار هر قسط بزن یا ردیف رو بکش. پرداخت ثبت‌شده فقط با علامت‌گذاری برگردانده می‌شود.</div>
  `;

  document.getElementById('cm-new').onclick = ()=>{ commitEditTarget='new'; renderCommitments(); };
  document.getElementById('cm-month-toggle').onclick = ()=>{ commitMonthOffset = commitMonthOffset===0 ? 1 : 0; renderCommitments(); };
  document.querySelectorAll('#commit-filters [data-f]').forEach(chip=>chip.onclick=()=>{
    commitFilter = chip.dataset.f; renderCommitments();
  });
  wireInstallmentRows(el);
  document.querySelectorAll('[data-detail]').forEach(row=>row.addEventListener('click', ()=>{
    const wrap = row.closest('.inst-wrap');
    if(wrap && wrap._swiped) return;
    commitDetailTarget = row.dataset.detail; renderCommitments();
  }));
  document.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click', ev=>{
    ev.stopPropagation();
    setPaid(b.dataset.check, parseInt(b.dataset.idx, 10), true, { withUndo:true, moved:true });
  }));
  document.getElementById('screen-commitments').scrollTop = prevScroll;
}

function renderPlanTechnique(){
  const tech = TECHNIQUES.find(t=>t.key===state.technique.key) || TECHNIQUES[TECHNIQUES.length-1];
  const income = reliableMonthlyIncome();
  const t = jToday();
  const fixed = totalFixedExpenses();
  const installments = commitmentForMonth(t.jy, t.jm, false);
  const savingsPct = state.technique.p.savings || 0;
  const savings = Math.round(income * savingsPct / 100);
  const daily = Math.max(0, income - fixed - installments - savings);
  const allocated = fixed + installments + daily + savings;
  const unallocated = Math.max(0, income - allocated);
  const moneyLeft = income - fixed - installments;
  const pctOf = v => income > 0 ? Math.round(v / income * 100) : 0;
  const seg = (v, color) => income > 0 && v > 0 ? `<div style="width:${(v/income*100).toFixed(1)}%; background:${color};"></div>` : '';
  document.getElementById('plan-technique').innerHTML = `
    <div class="card mb18">
      <div class="eyebrow">روش بودجه‌بندی</div>
      <div style="font-size:15px; font-weight:800; margin-bottom:4px;">${tech.label} · قابل ویرایش</div>
      <div style="font-size:12.5px; line-height:1.9; color:var(--ink-soft); margin-bottom:14px;">${tech.how || tech.desc}</div>
      <div class="chip-grid">
        ${TECHNIQUES.map(x=>`<div class="chip ${x.key===tech.key?'selected':''}" data-tech="${x.key}">${x.label}</div>`).join('')}
      </div>
    </div>
    <div class="card mb18">
      <div class="eyebrow">بودجه قابل تخصیص</div>
      <div class="kpi-num num" style="font-size:30px; color:var(--accent2);">${fa(income)}</div>
      <div class="muted" style="font-size:12px;">تومان · فقط درآمد قابل‌اتکا؛ درآمد متغیر کنار گذاشته شده است</div>
      <div class="alloc-bar">${seg(fixed, '#1E488F')}${seg(installments, '#001F3F')}${seg(daily, '#74C365')}${seg(savings, '#DBE64C')}</div>
      <div class="alloc-row"><span class="l"><span class="alloc-dot" style="background:#1E488F;"></span>هزینه‌های ثابت</span><span class="r num"><span style="font-weight:400; color:var(--muted); font-size:12px;">${fa(pctOf(fixed))}٪</span> ${toman(fixed)}</span></div>
      <div class="alloc-row"><span class="l"><span class="alloc-dot" style="background:#001F3F;"></span>اقساط برنامه‌ریزی‌شده</span><span class="r num"><span style="font-weight:400; color:var(--muted); font-size:12px;">${fa(pctOf(installments))}٪</span> ${toman(installments)}</span></div>
      <div class="alloc-row"><span class="l"><span class="alloc-dot" style="background:#74C365;"></span>روزمره و خواسته‌ها</span><span class="r num"><span style="font-weight:400; color:var(--muted); font-size:12px;">${fa(pctOf(daily))}٪</span> ${toman(daily)}</span></div>
      <div class="alloc-row"><span class="l"><span class="alloc-dot" style="background:#DBE64C;"></span>پس‌انداز اختیاری</span><span class="r num"><span style="font-weight:400; color:var(--muted); font-size:12px;">${fa(pctOf(savings))}٪</span> ${toman(savings)}</span></div>
      <div class="alloc-row total"><span class="l">تخصیص‌یافته</span><span class="r num">${toman(allocated)}</span></div>
      <div class="alloc-row"><span class="l">تخصیص‌نیافته</span><span class="r num">${toman(unallocated)}</span></div>
    </div>
    <div class="note"><span class="note-ic">ⓘ</span><span>از مانده ${toman(moneyLeft)}، ${toman(savings)} پس‌انداز و ${toman(daily)} روزمره تخصیص یافته است. پس‌انداز دوباره از هزینه ثابت یا اقساط کم نمی‌شود.</span></div>

  document.querySelectorAll('#plan-technique [data-tech]').forEach(x=>x.addEventListener('click', ()=>{
    const nt = TECHNIQUES.find(y=>y.key===x.dataset.tech);
