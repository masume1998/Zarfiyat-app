let calView = null; // { jy, jm, jd } selected day; month shown = its month
function renderPlanCalendar(){
  const t = jToday();
  if(!calView) calView = { jy: t.jy, jm: t.jm, jd: t.jd };
  const { jy, jm } = calView;
  const monthLen = jMonthLength(jy, jm);
  const g0 = toGregorian(jy, jm, 1);
  const firstOffset = (new Date(g0.gy, g0.gm - 1, g0.gd).getDay() + 1) % 7; // week starts Saturday
  const entries = [];
  state.commitments.forEach(cm=>{
    buildCommitmentSchedule(cm).forEach(e=>{
      if(e.jy===jy && e.jm===jm) entries.push(Object.assign({}, e, { cid: cm.id }));
    });
  });
  const byDay = {};
  entries.forEach(e=>{ (byDay[e.jd] = byDay[e.jd] || []).push(e); });
  const selEntries = byDay[calView.jd] || [];
  const selTotal = selEntries.reduce((s2,e)=>s2+e.amount, 0);
  const selUnpaid = selEntries.filter(e=>!e.paid).reduce((s2,e)=>s2+e.amount, 0);
  const selDate = { jy, jm, jd: calView.jd };
  const wds = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  let cells = '';
  for(let k=0;k<firstOffset;k++) cells += '<span></span>';
  for(let d=1; d<=monthLen; d++){
    const dayEntries = byDay[d] || [];
    const hasPaid = dayEntries.some(e=>e.paid);
    const hasUnpaid = dayEntries.some(e=>!e.paid);
    const isSel = d === calView.jd;
    const isToday = jy===t.jy && jm===t.jm && d===t.jd;
    cells += `<div class="day ${isSel?'sel':''} ${isToday?'today':''}" data-day="${d}">${fa(d)}${hasUnpaid?'<div class="dot"></div>':hasPaid?'<div class="dot paid"></div>':''}</div>`;
  }
  document.getElementById('plan-calendar').innerHTML = `
    <div class="card mb18">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <button class="icon-btn" id="cal-prev">›</button>
        <div style="font-size:16px; font-weight:800;">${MONTH_NAMES[jm]} ${fa(jy)}</div>
        <button class="icon-btn" id="cal-next">‹</button>
      </div>
      <div class="cal-grid">
        ${wds.map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="hint" style="margin-top:10px;">نقطه سبز: پرداخت‌شده · نقطه آبی: سررسید</div>
    </div>
    <div class="section-title">${jWeekdayName(selDate)}، ${fa(selDate.jd)} ${MONTH_NAMES[selDate.jm]} ${fa(selDate.jy)}</div>
    <div class="card">
      ${selEntries.length ? selEntries.map(e=>{
        const cm = state.commitments.find(c=>c.id===e.cid);
        return `<div class="waterfall-row"><span class="l">${cm ? cm.name : 'قسط'}${e.paid?' · پرداخت‌شده':''}</span><span class="r num" style="${e.paid?'color:var(--muted); text-decoration:line-through;':''}">${toman(e.amount)}</span></div>`;
      }).join('') : '<div class="muted" style="font-size:13px; padding:8px 0;">این روز سررسیدی ندارد.</div>'}
      <div class="waterfall-row total"><span class="l">جمع روز انتخاب‌شده</span><span class="r num">${toman(selTotal)}</span></div>
      <div class="waterfall-row"><span class="l">مانده پرداخت این روز</span><span class="r num">${toman(selUnpaid)}</span></div>
    </div>
  `;
  document.getElementById('cal-prev').onclick = ()=>{
    const p = jAddMonths(jy, jm, -1);
    calView = { jy:p.jy, jm:p.jm, jd: Math.min(calView.jd, jMonthLength(p.jy, p.jm)) };
    renderPlanCalendar();
  };
  document.getElementById('cal-next').onclick = ()=>{
    const p = jAddMonths(jy, jm, 1);
    calView = { jy:p.jy, jm:p.jm, jd: Math.min(calView.jd, jMonthLength(p.jy, p.jm)) };
    renderPlanCalendar();
  };
  document.querySelectorAll('#plan-calendar [data-day]').forEach(d=>d.onclick=()=>{
    calView.jd = parseInt(d.dataset.day, 10);
    renderPlanCalendar();
  });
}

function renderPlanCashflow(){
  const t = jToday();
  const key = t.jy + '-' + t.jm;
  const incomeR = reliableMonthlyIncome();
  const income = incomeR + variableMonthlyIncome();
  const fixed = totalFixedExpenses();
  const savingsPct = state.technique.p.savings || 0;
  const savings = Math.round(incomeR * savingsPct / 100);
  const log = state.savingsLog[key];
  const kept = !log || log.kept !== false;
  const actualAmount = log && log.amount != null ? log.amount : savings;

  const months = nextMonths(8);
  const rows = months.map(m=>{
    const inst = commitmentForMonth(m.jy, m.jm, false);
    return { m, inst, free: incomeR - fixed - inst - savings };
  });
  const frees = rows.map(r=>r.free);
  const minFree = Math.min(...frees), maxFree = Math.max(...frees);
  const maxBar = Math.max(...frees, 1);

  document.getElementById('plan-cashflow').innerHTML = `
    <div class="hero mb18">
      <div class="hero-label">مانده ماهانه برای روزمره</div>
      <div class="hero-num num">${faM(minFree)} تا ${faM(maxFree)} <span style="font-size:15px; color:rgba(255,255,255,.7);">میلیون تومان</span></div>
      <div class="hero-sub">پس از هزینه ثابت، اقساط و پس‌انداز برنامه‌ریزی‌شده</div>
      <div class="bars">
        ${rows.map((r,idx)=>`
          <div class="bar-col">
            <div class="bar-val num" style="color:${r.free<0?'var(--danger)':''};">${faM(r.free)}</div>
            <div class="bar ${idx===rows.length-1?'last':''}" style="height:${Math.max(6, Math.round(r.free / maxBar * 100))}px;"></div>
            <div class="bar-lab">${MONTH_NAMES[r.m.jm]}</div>
          </div>`).join('')}
      </div>
      <div class="hero-sub" style="margin-top:8px;">جهت زمان: راست به چپ · ${MONTH_NAMES[months[0].jm]} تا ${MONTH_NAMES[months[months.length-1].jm]}</div>
    </div>

    <div class="section-title">پیش‌بینی ماهانه</div>
    <div class="card mb18">
      <div class="tbl">
        <div class="tbl-row head"><span class="c">ماه</span><span class="c">اقساط</span><span class="c l">مانده روزمره</span></div>
        ${rows.map(r=>`<div class="tbl-row"><span class="c">${MONTH_NAMES[r.m.jm]} ${fa(r.m.jy)}</span><span class="c num">${fa(r.inst)}</span><span class="c l num" style="color:${r.free<0?'var(--danger)':'var(--safe)'};">${fa(r.free)}</span></div>`).join('')}
      </div>
      <div class="hint">اعداد جدول: تومان · مانده = درآمد قابل‌اتکا − ثابت − اقساط − پس‌انداز برنامه‌ریزی‌شده</div>
    </div>

    <div class="note"><span class="note-ic">ⓘ</span><span>پایه هر ماه: ${toman(incomeR)} درآمد قابل‌اتکا، ${toman(fixed)} هزینه ثابت و ${toman(savings)} پس‌انداز برنامه‌ریزی‌شده. درآمد متغیر در این مانده منظور نشده است.</span></div>

    <div class="section-title">پس‌انداز واقعی این ماه</div>
    <div class="hint mb14">گاهی پس‌انداز برنامه‌ریزی‌شده در طول ماه خرج می‌شه. اینجا واقعیتش رو ثبت کن.</div>
    <div class="card mb18">
      <div class="chip-grid mb14" id="sv-toggle">
        <div class="chip ${kept?'selected':''}" data-kept="1">کامل نگه‌داشتم</div>
        <div class="chip ${!kept?'selected':''}" data-kept="0">بخشیش رو خرج کردم</div>
      </div>
      <div id="sv-amount-wrap" style="display:${kept?'none':'block'};">
        <div class="field-label">چقدر واقعاً پس‌انداز مونده؟</div>
        <input class="input amt-input num mb14" id="sv-amount" inputmode="numeric" placeholder="مثلاً ۳۰۰٬۰۰۰" value="${!kept?fa(actualAmount):''}">
      </div>
      <button class="btn btn-ghost" id="sv-save">ثبت پس‌انداز واقعی</button>
    </div>`;

  wireAmountInputs(document.getElementById('plan-cashflow'));
  let svKept = kept;
  document.querySelectorAll('#sv-toggle [data-kept]').forEach(chip=>chip.onclick=()=>{
    document.querySelectorAll('#sv-toggle [data-kept]').forEach(x=>x.classList.remove('selected'));
    chip.classList.add('selected');
    svKept = chip.dataset.kept === '1';
    document.getElementById('sv-amount-wrap').style.display = svKept ? 'none' : 'block';
  });
  document.getElementById('sv-save').onclick = ()=>{
    if(svKept){
      delete state.savingsLog[key];
    } else {
      const amount = parseFaNumber(document.getElementById('sv-amount').value);
      state.savingsLog[key] = { kept:false, amount };
    }
    saveState();
    showToast('پس‌انداز این ماه ثبت شد ✅');
    renderPlanCashflow();
  };
}

let profileEditIncome = null;
let profileEditFixed = null;

let profileView = 'main'; // 'main' | 'income' | 'cap' | 'tech'

function exportState(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zarfiyat-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    showToast('خروجی آماده شد ✅');
  }catch(e){ showToast('خروجی ممکن نشد'); }
}

function importState(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || (!Array.isArray(data.commitments) && !Array.isArray(data.incomeSources))) throw new Error('bad backup');
      if(!confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین بشه؟')) return;
      state = Object.assign(defaultState(), data);
      state.commitments = (state.commitments||[]).map(migrateCommitment);
      if(!Array.isArray(state.savedProposals)) state.savedProposals = [];
      if(!state.savingsLog) state.savingsLog = {};
      saveState();
      profileView = 'main';
      renderProfile();
      showToast('نسخه پشتیبان بازگردانی شد ✅');
    }catch(e){ showToast('فایل پشتیبان معتبر نیست'); }
  };
  reader.onerror = ()=> showToast('خواندن فایل ممکن نشد');
  reader.readAsText(file);
}

/* ---- Purchase advisor: rule-based, local-only ----
   Uses only data already on this device: reliable income, fixed
   expenses, savings %, installment cap + thresholds, existing
   commitments, and the pending simulation. No fetch, no API key,
   nothing leaves the device. It answers in plain Persian WHY,
   and proposes computed alternatives that re-run the same sim. */
function adviceWorstForSchedule(entries, horizonMonths){
  const c = cap();
  let worst = { pct:0, share:0, jy:0, jm:0, val:0 };
  const months = nextMonths(Math.max(6, horizonMonths || 6));
  months.forEach(m=>{
    const existing = commitmentForMonth(m.jy, m.jm, false);
    const withNew = entries.filter(e=>e.jy===m.jy && e.jm===m.jm).reduce((s,e)=>s+e.amount, 0);
    const total = existing + withNew;
    const pct = c>0 ? (total/c)*100 : 0;
    const share = shareOfIncome(total);
    if(pct > worst.pct) worst = { pct, share, jy:m.jy, jm:m.jm, val: total };
  });
  return worst;
}
function buildPurchaseAdvice(p, scheduleEntries, worst, capVal, status){
  const incomeR = reliableMonthlyIncome();
  const incomeV = variableMonthlyIncome();
  const incomeT = incomeR + incomeV;
  const fixed = totalFixedExpenses();
  const savingsPct = (state.technique && state.technique.p && typeof state.technique.p.savings === 'number') ? state.technique.p.savings : 20;
  const savings = Math.round(incomeR * savingsPct / 100);
  const down = p.downPayment || 0;
  const principal = typeof p.principal === 'number' ? p.principal : Math.max(0, p.price - down);
  const interestAmt = p.interestMode === 'amount' ? (p.interestAmount || 0) : Math.round(principal * (p.interestPercent || 0) / 100);
  const fee = p.fee || 0;
  const extra = interestAmt + fee;
  const financed = principal + interestAmt + fee;
  const totalCost = down + financed;
  const reasons = [];
  const alternatives = [];
  let title = '', text = '', tone = status;

  if(!incomeR || !capVal){
    title = 'اول درآمد رو وارد کن';
    text = 'بدون درآمد نمی‌تونم بگم می‌صرفه یا نه.';
    tone = 'caution';
    reasons.push('سقف از درآمد حساب می‌شه.');
    reasons.push(`قسط ماهانه: ${toman(p.monthly)}.`);
    return { tone, title, text, reasons, alternatives, totalCost, extra };
  }

  const newInWorst = scheduleEntries.filter(e=>e.jy===worst.jy && e.jm===worst.jm).reduce((s,e)=>s+e.amount, 0);
  const existingWorst = worst.val - newInWorst;
  const freeCashWorst = incomeT - fixed - worst.val - savings;
  const monthlyShare = incomeR > 0 ? (p.monthly / incomeR * 100) : 0;
  const worstName = MONTH_NAMES[worst.jm];
  const worstShare = Math.round(worst.share || 0);

  reasons.push(`سنگین‌ترین ماه: ${worstName} — ${toman(worst.val)} (${fa(worstShare)}٪ درآمد).`);
  reasons.push(`قسط ماهانه: ${toman(p.monthly)} (${fa(Math.round(monthlyShare))}٪ درآمد).`);
  if(extra > 0) reasons.push(`هزینه‌ی کل: ${toman(totalCost)} — ${toman(extra)} سود و کارمزد.`);
  else if(freeCashWorst < 0) reasons.push(`پول آزاد ${worstName}: ${toman(Math.abs(freeCashWorst))} کم میاری.`);
  else if(worst.val > capVal) reasons.push(`از سقف (${toman(capVal)}) ${toman(worst.val - capVal)} رد شده.`);
  else reasons.push(`پول آزاد ${worstName}: ${toman(freeCashWorst)}.`);

  const cashRisk = freeCashWorst < 0;
  if(status === 'safe' && !cashRisk){
    tone = 'safe';
    title = 'می‌صرفه';
    text = p.necessity === 'optional' ? 'جا می‌شه، ولی غیرضروریه.' : 'جا می‌شه.';
  } else if(status === 'caution' && !cashRisk){
    tone = 'caution';
    title = 'با احتیاط می‌صرفه';
    text = p.necessity === 'optional' ? 'لب مرزه و غیرضروریه — صبر کن.' : 'جا می‌شه، ولی ماه سنگین شلوغ می‌شه.';
  } else {
    tone = 'danger';
    title = 'الان نمی‌صرفه';
    text = p.necessity === 'optional' ? 'الان وقتش نیست.' : 'الان سنگینه — اول جایگزین‌ها رو ببین.';
  }
  if(cashRisk && tone === 'safe'){
    tone = 'caution';
    title = 'پول نقد کم میاری';
    text = 'سقف رد نشده، ولی پول آزاد منفی می‌شه.';
  }

  // Only propose spreading / delaying when the purchase is not already safe.
  if(status !== 'safe' || cashRisk){
    let bestLonger = null;
    [2, 4, 6].forEach(add=>{
      const n = p.installments + add;
      if(n > 24) return;
      const newMonthly = Math.round(financed / n);
      const entries = generateSchedule(p.purchaseDate, n, newMonthly, p.scheduleType, p.intervalDays, p.channel, p.providerKey);
      const w = adviceWorstForSchedule(entries, n + 1);
      if(w.pct < worst.pct - 3 && (!bestLonger || w.pct < bestLonger.worst.pct)){
        bestLonger = { n, newMonthly, worst: w };
      }
    });
    if(bestLonger){
      alternatives.push({ kind:'installments', installments:bestLonger.n, label:`قسط رو به ${fa(bestLonger.n)} ماه ببر`, sub:`قسط: ${toman(bestLonger.newMonthly)} — سنگین‌ترین ماه: ${fa(Math.round(bestLonger.worst.share))}٪ درآمد` });
    }
    try{
      const t = jAddMonths(p.purchaseDate.jy, p.purchaseDate.jm, 1);
      const delayedDate = { jy:t.jy, jm:t.jm, jd:Math.min(p.purchaseDate.jd, jMonthLength(t.jy, t.jm)) };
      const entries = generateSchedule(delayedDate, p.installments, p.monthly, p.scheduleType, p.intervalDays, p.channel, p.providerKey);
      const w = adviceWorstForSchedule(entries, p.installments + 1);
      if(w.pct < worst.pct - 3){
        alternatives.push({ kind:'delay', delayMonths:1, purchaseDate:delayedDate, label:'یه ماه عقب بنداز', sub:`شروع اقساط از ${MONTH_NAMES[delayedDate.jm]} — سنگین‌ترین ماه: ${fa(Math.round(w.share))}٪ درآمد` });
      }
    }catch(e){}
  }
  return { tone, title, text, reasons, alternatives, totalCost, extra };
}

        <button class="btn btn-primary" id="sm-add-income">افزودن درآمد قابل‌اتکا</button>
        <button class="btn btn-ghost" id="sm-register-anyway">فعلاً ثبت و پیگیری اقساط</button>
      </div>`;
    document.getElementById('sm-back').onclick = ()=>{ state.pendingSimulation=null; renderSimStart(); };
    document.getElementById('sm-add-income').onclick = ()=>{ state.pendingSimulation=null; goTo('profile'); };
    document.getElementById('sm-register-anyway').onclick = ()=>{ registerSimCommitment(); };
    return;
  }

  let scheduleEntries = [];
  let worst = { pct:0, share:0, jy:0, jm:0, val:0 };
  scheduleEntries = generateSchedule(p.purchaseDate, p.installments, p.monthly, p.scheduleType, p.intervalDays, p.channel, p.providerKey);
  const months = nextMonths(Math.max(6, p.installments+1));
  months.forEach(m=>{
    const existing = commitmentForMonth(m.jy,m.jm,false);
    const withNew = scheduleEntries.filter(e=>e.jy===m.jy&&e.jm===m.jm).reduce((s,e)=>s+e.amount,0);
    const total = existing + withNew;
    const pct = c>0 ? (total/c)*100 : 0;
    const share = shareOfIncome(total);
    if(pct > worst.pct) worst = { pct, share, jy:m.jy, jm:m.jm, val: total };
  });
  const status = statusFromShare(worst.share);
  const sm = statusMeta(status);
  const worstShare = Math.round(worst.share || 0);
  const overCap = Math.max(0, worst.val - c);
  const advice = buildPurchaseAdvice(p, scheduleEntries, worst, c, status);
  const adviceToneColor = advice.tone==='safe' ? 'var(--safe)' : advice.tone==='caution' ? 'var(--caution)' : 'var(--danger)';
  const adviceToneBg = advice.tone==='safe' ? 'var(--safe-soft)' : advice.tone==='caution' ? 'var(--caution-soft)' : 'var(--danger-soft)';

  const heroTitle =
    status==='safe' ? 'این پیشنهاد در محدوده شماست' :
    status==='caution' ? 'در مرز ظرفیت شما' : 'این خرید، فشار زیادی می‌سازد';
  const paidCount = Math.min(p.paidCount || 0, p.installments);

  el.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" id="sm-back"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#001F3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 style="font-size:17px;">${heroTitle}</h2>
    </div>
    <div class="muted" style="font-size:12.5px; margin-bottom:18px;">${p.name} · ${p.provider} · ${fa(p.installments)} قسط</div>

    <div class="hero mb18">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
        <span class="hero-chip ${status}">${sm.emoji} ${sm.label}</span>
        <span class="hero-label">پیشنهاد · خریدی مستقل</span>
      </div>
      <div class="hero-label">${status==='safe' ? 'سهم کل اقساط از درآمد، پس از خرید' : 'بیشترین سهم اقساط از درآمد'}</div>
      <div class="hero-num num">${fa(worstShare)}٪</div>
      <div class="hero-row"><span class="l">اقساط قبلی + قسط جدید ${toman(p.monthly)}</span><span class="r num">${toman(worst.val)}</span></div>
      ${overCap > 0
        ? `<div class="hero-row"><span class="l">بیش از سقف ${toman(c)}</span><span class="r num" style="color:#F3A28E;">${toman(overCap)}</span></div>`
        : `<div class="hero-row"><span class="l">ظرفیت آزاد از سقف</span><span class="r num">${toman(Math.max(0, c - worst.val))}</span></div>`}
    </div>

    <div class="section-title">مشاور خرید <span class="muted" style="font-size:11px; font-weight:400;">بدون ارسال داده</span></div>
    <div class="card mb18" style="background:${adviceToneBg}; border:none;">
      <div style="font-size:15px; font-weight:800; color:${adviceToneColor}; margin-bottom:4px;">${advice.title}</div>
      <div class="muted" style="font-size:12.5px; line-height:1.8;">${advice.text}</div>
      ${advice.alternatives.length ? `
        <div class="advisor-alt-title">سبک‌ترش کن:</div>
        ${advice.alternatives.map((a,i)=>`<button class="advisor-alt" data-alt="${i}"><span class="advisor-alt-label">${a.label}</span><span class="advisor-alt-sub">${a.sub}</span></button>`).join('')}
        <div class="hint">با زدن هر گزینه دوباره بررسی می‌شه.</div>` : ''}
    </div>

    <div class="card mb18">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px;">
        <span style="font-size:13px; font-weight:700;">جمع پرداخت</span>
        <span class="num" style="font-size:17px; font-weight:800;">${toman(totalCost)}</span>
      </div>
      <div class="muted" style="font-size:12px; margin-top:4px;">${fa(p.installments)} قسط × ${toman(p.monthly)} · اضافه‌تر از نقدی: ${toman(extra)}</div>
    </div>

    <div class="section-title">سهم اقساط در سنگین‌ترین ماه (${MONTH_NAMES[worst.jm]})</div>
    <div class="card mb18">
      <div style="position:relative; height:10px; border-radius:100px; background:var(--track); overflow:hidden;">
        <div style="height:100%; width:${Math.min(100, worstShare)}%; background:${adviceToneColor}; border-radius:100px;"></div>
        <div style="position:absolute; top:-2px; bottom:-2px; right:calc(30% - 1px); width:2px; background:var(--ink);"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:8px;">
        <span>سهم شما: ${fa(worstShare)}٪</span><span>سقف امن: ۳۰٪</span>
      </div>
    </div>

    <div class="step-actions">
      <button class="btn btn-primary" id="sm-confirm">می‌خرم</button>
      <button class="btn btn-ghost" id="sm-cancel">نمی‌خرم</button>
    </div>
    <div style="text-align:center; margin-top:10px;"><span class="link" id="sm-save-only" style="font-size:12.5px; font-weight:700; color:var(--safe); cursor:pointer;">ذخیره برای مقایسه</span></div>
  `;
  el.querySelectorAll('[data-alt]').forEach(btn=>btn.onclick=()=>{
    const alt = advice.alternatives[parseInt(btn.dataset.alt, 10)];
    if(!alt) return;
    if(alt.kind === 'installments'){
      p.installments = alt.installments;
      p.monthly = Math.round(financed / alt.installments);
    } else if(alt.kind === 'delay' && alt.purchaseDate){
      p.purchaseDate = alt.purchaseDate;
    }
    state.pendingSimulation = p;
    renderSimResult();
  });
  document.getElementById('sm-back').onclick = ()=>{ state.pendingSimulation=null; renderSimStart(); };
  const cancelBtn = document.getElementById('sm-cancel');
  if(cancelBtn) cancelBtn.onclick = ()=>{
    state.pendingSimulation = null; showToast('خرید ثبت نشد'); goTo('home');
  };
  const saveOnlyBtn = document.getElementById('sm-save-only');
  if(saveOnlyBtn) saveOnlyBtn.onclick = ()=>{
    state.savedProposals = state.savedProposals || [];
    state.savedProposals.unshift({ id: uid(), name:p.name, price:p.price, downPayment:down, principal,
      interestMode:p.interestMode, interestPercent:p.interestPercent, interestAmount:interestAmt, fee,
      installments:p.installments, monthly:p.monthly, provider:p.provider, providerKey:p.providerKey,
      scheduleType:p.scheduleType, intervalDays:p.intervalDays, purchaseDate:p.purchaseDate,
      necessity:p.necessity, channel:p.channel, paidCount, totalCost, createdAt: Date.now() });
    saveState();
    state.pendingSimulation = null;
    showToast('برای مقایسه ذخیره شد ✅');
    renderSimStart();
  };
  const confirmBtn = document.getElementById('sm-confirm');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    registerSimCommitment();
  };

  function registerSimCommitment(){
    const paidFlags = Array(p.installments).fill(false);
    for(let i=0; i<paidCount; i++) paidFlags[i] = true;
    if(p.channel==='online') paidFlags[0] = true;
    state.commitments.unshift({
      id: uid(), name:p.name, type:'bnpl', total:p.price, downPayment:down, principal,
      interestMode:p.interestMode, interestPercent:p.interestPercent||0, interestAmount:interestAmt, fee,
      installments:p.installments, monthly:p.monthly, provider:p.provider, providerKey:p.providerKey,
      scheduleType:p.scheduleType, intervalDays:p.intervalDays, purchaseDate:p.purchaseDate,
      necessity:p.necessity, channel:p.channel, paidFlags
    });
    state.pendingSimulation = null;
    saveState();
    showToast('خرید با موفقیت ثبت شد ✅');
    goTo('commitments');
  }
}

loadState();
if(state.reduceMotion) document.body.classList.add('reduce-motion');
if(state.onboarded){
  document.getElementById('bottom-nav').style.display = 'flex';
  goTo('home');
} else {
  renderOnboarding();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      if(!reg.active) return; // first install: nothing to update from
      // If a newer version is live, install it and reload once it takes over,
      // so updates stop getting stuck on the old cache.
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if(reloading) return; reloading = true; location.reload();
      });
      fetch('./service-worker.js?v=' + Date.now(), { cache: 'no-store' }).then(r=>r.text()).then(txt=>{
        const m = txt.match(/CACHE_NAME = '([^']+)'/);
        if(!m) return;
        caches.keys().then(keys=>{
          if(keys.length && !keys.includes(m[1])) reg.update();
        });
      }).catch(()=>{});
    }).catch(() => {});
  });
}
</script>
</body>
</html>
