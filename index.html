<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ظرفیت | دستیار تصمیم‌گیری مالی شخصی</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#001F3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ظرفیت">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap">
<style>
  :root{
    --ink:#001F3F; --ink-soft:#2C4A6B; --muted:#6E7C8C;
    --paper:#F6F7ED; --paper-deep:#EAECDD; --surface:#FFFFFF; --line:#DEE1D2;
    --safe:#00804C; --safe-soft:#E1F0E6;
    --caution:#8A7200; --caution-soft:#F7F3D2;
    --danger:#B3402A; --danger-soft:#F6E4DF;
    --accent:#DBE64C; --accent2:#1E488F;
    --track:#E3E6D6;
    --shadow: 0 18px 40px -18px rgba(0,31,63,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background: radial-gradient(circle at 18% -10%, #E4E9DA 0%, transparent 55%),
      radial-gradient(circle at 100% 110%, #DCE6EF 0%, transparent 45%), #DCE2D6;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px; color:var(--ink);
  }
  ::selection{ background: var(--safe); color:#fff; }
  h1,h2,h3{ font-weight:800; letter-spacing:-.01em; }
  .num{ font-variant-numeric: tabular-nums; }
  .eyebrow{ font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }

  .device{
    width:100%; max-width:400px; height:840px; max-height:92vh;
    background:var(--paper); border-radius:44px; border:10px solid var(--ink);
    box-shadow: var(--shadow), 0 0 0 2px rgba(0,31,63,.06);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:var(--ink); border-radius:0 0 16px 16px; z-index:30; }
  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .device{ width:100vw; max-width:none; height:100vh; height:100dvh; max-height:none;
      border:none; border-radius:0; box-shadow:none; }
    .notch{ display:none; }
    .bottom-nav{ padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }

  .screens{ flex:1; position:relative; overflow:hidden; }
  .screen{ position:absolute; inset:0; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;
    padding:30px 20px 110px; opacity:0; visibility:hidden; transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease; }
  .screen::-webkit-scrollbar{ display:none; }
  .screen.active{ opacity:1; visibility:visible; transform:translateY(0); }

  .card{ background:var(--surface); border-radius:22px; padding:20px; border:1px solid var(--line); }
  .card + .card{ margin-top:14px; }
  .section-title{ font-size:14px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .section-title span.link{ font-size:12px; font-weight:600; color:var(--safe); cursor:pointer; }
  .muted{ color:var(--muted); }
  .hint{ font-size:11px; color:var(--muted); margin-top:5px; line-height:1.6; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px;
    border-radius:100px; border:none; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--safe); color:#fff; }
  .btn-ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-sm{ padding:10px 16px; font-size:13px; width:auto; }
  .btn-outline-danger{ background:transparent; color:var(--danger); border:1px solid rgba(179,64,42,.35); }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  .field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .input, select.input, .date-field{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
  }
  .row-2{ display:flex; gap:10px; } .row-2 > *{ flex:1; }
  .row-3{ display:flex; gap:8px; } .row-3 > *{ flex:1; min-width:0; }
  .mb14{ margin-bottom:14px; } .mb18{ margin-bottom:18px; } .mb22{ margin-bottom:22px; }

  .chip{ padding:9px 14px; border-radius:100px; border:1.4px solid var(--line); background:var(--surface);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip.selected{ border-color:var(--safe); background:var(--safe-soft); color:var(--safe); }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }

  .list-row{ display:flex; align-items:center; gap:12px; padding:13px 0; cursor:pointer; }
  .list-row + .list-row{ border-top:1px dashed var(--line); }
  .list-row .emoji-badge{ width:38px; height:38px; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .title{ font-size:13.5px; font-weight:700; }
  .list-row .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .list-row .amount{ font-size:13.5px; font-weight:800; }
  .row-del, .row-edit{ width:26px; height:26px; border-radius:50%; background:var(--paper-deep); border:none;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; cursor:pointer; flex:0 0 auto;}

  .step-dots{ display:flex; gap:6px; margin-bottom:22px; justify-content:center; }
  .step-dots span{ width:26px; height:4px; border-radius:4px; background:var(--track); }
  .step-dots span.done{ background:var(--safe); }
  .step-dots span.now{ background:var(--ink); }
  .step-title{ font-size:20px; font-weight:800; margin-bottom:6px; }
  .step-sub{ font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.7; }
  .step-actions{ position:sticky; bottom:0; background:linear-gradient(0deg,var(--paper) 65%,transparent);
    padding-top:16px; display:flex; gap:10px; }

  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin:10px 0 2px; position:relative; }
  .gauge-figure{ position:relative; width:200px; }
  .gauge-figure svg{ width:100%; display:block; }
  .gauge-center{ position:absolute; left:0; right:0; bottom:4px; text-align:center; }
  .gauge-center .big{ font-size:24px; font-weight:800; }
  .gauge-center .small{ font-size:11px; color:var(--muted); }

  .status-chip{ font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; display:inline-flex; align-items:center; gap:5px; }
  .status-chip.safe{ background:var(--safe-soft); color:var(--safe); }
  .status-chip.caution{ background:var(--caution-soft); color:var(--caution); }
  .status-chip.danger{ background:var(--danger-soft); color:var(--danger); }
  .status-chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .month-strip{ display:flex; gap:9px; overflow-x:auto; padding-bottom:2px; }
  .month-pill{ flex:0 0 auto; width:92px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center; }
  .month-pill .mname{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .mbar{ height:6px; border-radius:100px; background:var(--track); overflow:hidden; margin-bottom:7px; }
  .mbar-fill{ height:100%; border-radius:100px; }
  .month-pill .mval{ font-size:11.5px; font-weight:700; }

  .segmented{ display:flex; background:var(--paper-deep); border-radius:100px; padding:3px; margin-bottom:18px; }
  .segmented button{ flex:1; border:none; background:transparent; padding:9px 6px; border-radius:100px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:0 2px 6px rgba(0,31,63,.1); }

  .waterfall-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; gap:10px; }
  .waterfall-row + .waterfall-row{ border-top:1px dashed var(--line); }
  .waterfall-row .l{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .waterfall-row .r{ font-size:14.5px; font-weight:800; text-align:left; }
  .waterfall-row.total .r{ font-size:17px; }
  .waterfall-arrow{ text-align:center; color:var(--line); font-size:12px; }

  .cal-month-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .cal-month-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-month-head .name{ font-size:14.5px; font-weight:800; }
  .cal-due-row{ display:flex; justify-content:space-between; font-size:11.5px; padding:4px 0; color:var(--ink-soft); }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; }
  .filter-chip{ padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .filter-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{ position:absolute; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:100px; font-size:12px; font-weight:700;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bottom-nav{ position:relative; z-index:20; background:var(--surface); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around; padding:10px 8px 16px; }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:10px; font-weight:700; color:var(--muted); cursor:pointer; padding:4px 6px; }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--safe); }
  .nav-fab{ width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--ink); display:flex;
    align-items:center; justify-content:center; border:none; margin-top:-30px;
    box-shadow:0 10px 22px -6px rgba(219,230,76,.7); cursor:pointer; }
  .nav-fab svg{ width:22px; height:22px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
  .badge-necessity{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .badge-necessity.req{ background:var(--safe-soft); color:var(--safe); }
  .badge-necessity.semi{ background:var(--caution-soft); color:var(--caution); }
  .badge-necessity.optional{ background:var(--danger-soft); color:var(--danger); }
  .badge-channel{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--paper-deep); color:var(--ink-soft); }

  .schedule-swipe-wrap{ position:relative; overflow:hidden; border-radius:8px; margin-top:2px; }
  .schedule-swipe-hint{ position:absolute; inset:0; background:var(--safe-soft); color:var(--safe);
    display:flex; align-items:center; padding-right:14px; font-size:11px; font-weight:700; }
  .schedule-item{ position:relative; z-index:1; background:var(--surface); display:flex; justify-content:space-between;
    font-size:12px; padding:9px 8px; border-top:1px dashed var(--line); touch-action:pan-y; user-select:none; }
  .schedule-item.paid-row{ background:var(--safe-soft); }
  .schedule-item .paid{ color:var(--muted); text-decoration:line-through; }
  .schedule-item .check{ margin-left:6px; }

  .due-banner{ background:var(--caution-soft); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  .due-banner .row{ display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--ink-soft); }
  .due-banner .title{ font-size:12.5px; font-weight:800; color:var(--caution); margin-bottom:6px; }

  input[type="range"]{ -webkit-appearance:none; width:100%; height:6px; border-radius:100px; background:var(--track); outline:none; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--safe); border:4px solid #fff; box-shadow:0 2px 8px rgba(0,128,76,.4); cursor:pointer; }
</style>
</head>
<body>

<div class="device">
  <div class="notch"></div>
  <div class="screens">

    <div class="screen active" id="screen-ob">
      <div id="ob-steps"></div>
    </div>

    <div class="screen" id="screen-home">
      <div id="home-content"></div>
    </div>

    <div class="screen" id="screen-commitments">
      <div id="commitments-content"></div>
    </div>

    <div class="screen" id="screen-plan">
      <div class="topbar"><h2 style="font-size:18px;">برنامه مالی</h2></div>
      <div class="segmented" id="plan-segmented">
        <button data-seg="technique" class="active">تکنیک بودجه</button>
        <button data-seg="calendar">تقویم</button>
        <button data-seg="cashflow">جریان نقدی</button>
      </div>
      <div id="plan-technique"></div>
      <div id="plan-calendar" style="display:none;"></div>
      <div id="plan-cashflow" style="display:none;"></div>
    </div>

    <div class="screen" id="screen-profile">
      <div id="profile-content"></div>
    </div>

    <div class="screen" id="screen-sim">
      <div id="sim-content"></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-btn active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      خانه
    </button>
    <button class="nav-btn" data-nav="commitments">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      تعهدات
    </button>
    <button class="nav-fab" data-nav="sim">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#001F3F" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="nav-btn" data-nav="plan">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      برنامه
    </button>
    <button class="nav-btn" data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.6-3.6 4.4-5.4 7-5.4S17.4 16.4 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      پروفایل
    </button>
  </div>
</div>

<script>
"use strict";

function jdiv(a,b){ return Math.trunc(a/b); }
function jmod(a,b){ return a - Math.trunc(a/b)*b; }
function g2d(gy,gm,gd){
  let d = jdiv((gy + jdiv(gm-8,6) + 100100)*1461,4) + jdiv(153*jmod(gm+9,12)+2,5) + gd - 34840408;
  d = d - jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4*jdn + 139361631;
  j = j + jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4 - 3908;
  const i = jdiv(jmod(j,1461),4)*5 + 308;
  const gd = jdiv(jmod(i,153),5) + 1;
  const gm = jmod(jdiv(i,153),12) + 1;
  const gy = jdiv(j,1461) - 100100 + jdiv(8-gm,6);
  return {gy,gm,gd};
}
function jalCal(jy){
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const gy = jy + 621;
  let leapJ = -14, jp = breaks[0], jump = 0;
  for(let i=1;i<breaks.length;i++){
    const jm = breaks[i];
    jump = jm - jp;
    if(jy < jm) break;
    leapJ = leapJ + jdiv(jump,33)*8 + jdiv(jmod(jump,33),4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + jdiv(n,33)*8 + jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33) === 4 && jump-n === 4) leapJ += 1;
  const leapG = jdiv(gy,4) - jdiv((jdiv(gy,100)+1)*3,4) - 150;
  const march = 20 + leapJ - leapG;
  if(jump - n < 6) n = n - jump + jdiv(jump+4,33)*33;
  let leap = jmod(jmod(n+1,33)-1,4);
  if(leap === -1) leap = 4;
  return {leap, gy, march};
}
function isLeapJalaali(jy){ return jalCal(jy).leap === 0; }
function j2d(jy,jm,jd){
  const r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - jdiv(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy;
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(gy,3,r.march);
  let k = jdn - jdn1f, jm, jd;
  if(k >= 0){
    if(k <= 185){ jm = 1 + jdiv(k,31); jd = jmod(k,31) + 1; return {jy,jm,jd}; }
    k -= 186;
  } else {
    jy -= 1; k += 179;
    if(jalCal(jy).leap === 1) k += 1;
  }
  jm = 7 + jdiv(k,30); jd = jmod(k,30) + 1;
  return {jy,jm,jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function jMonthLength(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaali(jy)?30:29; }
function jAddMonths(jy,jm,n){
  let total = (jy*12 + (jm-1)) + n;
  return { jy: Math.floor(total/12), jm: (total%12)+1 };
}
function jToday(){ const now = new Date(); return toJalaali(now.getFullYear(), now.getMonth()+1, now.getDate()); }

const MONTH_NAMES = ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function fmtJDate(j){ return `${fa(j.jd)} ${MONTH_NAMES[j.jm]} ${fa(j.jy)}`; }
function fmtJDateShort(j){ return `${fa(j.jd)} ${MONTH_NAMES[j.jm]}`; }

function fa(n){ return Math.round(n).toLocaleString('fa-IR'); }
function toman(n){ return fa(n) + ' تومان'; }
function parseFaNumber(str){
  if(!str) return 0;
  const digits = String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'');
  return parseInt(digits || '0', 10);
}
function uid(){ return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function attachAmountFormat(el){
  if(!el || el._faFormatted) return;
  el._faFormatted = true;
  el.addEventListener('input', ()=>{
    const digits = el.value.replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'');
    el.value = digits ? parseInt(digits,10).toLocaleString('fa-IR') : '';
  });
}
function wireAmountInputs(root){
  (root || document).querySelectorAll('.amt-input').forEach(attachAmountFormat);
}

function jalaliPickerHTML(prefix, j){
  const years = []; for(let y=j.jy-3; y<=j.jy+2; y++) years.push(y);
  return `<div class="row-3">
    <select class="input" id="${prefix}-d"></select>
    <select class="input" id="${prefix}-m">
      ${MONTH_NAMES.slice(1).map((n,i)=>`<option value="${i+1}" ${i+1===j.jm?'selected':''}>${n}</option>`).join('')}
    </select>
    <select class="input" id="${prefix}-y">
      ${years.map(y=>`<option value="${y}" ${y===j.jy?'selected':''}>${fa(y)}</option>`).join('')}
    </select>
  </div>`;
}
function fillJalaliDays(prefix, keepDay){
  const y = parseInt(document.getElementById(prefix+'-y').value,10);
  const m = parseInt(document.getElementById(prefix+'-m').value,10);
  const len = jMonthLength(y,m);
  const daySel = document.getElementById(prefix+'-d');
  const target = Math.min(keepDay || parseInt(daySel.value,10) || 1, len);

const STORAGE_KEY = 'zarfiyat-financial-state-v1';
const NOTIF_KEY_PREFIX = 'zarfiyat-notified-';

function defaultState(){
  return {
    onboarded: false,
    name: '',
    incomeSources: [],
    fixedExpenses: [],
    technique: { key:'50-30-20', p:{needs:50,wants:30,savings:20} },
    installmentCapPercent: 30,
    thresholds: { safe:30, caution:40 },
    commitments: [],
    pendingSimulation: null,
    notificationsEnabled: false
  };
}
let state = defaultState();

function migrateCommitment(c){
  if(!c.channel) c.channel = 'in_person';
  if(!Array.isArray(c.paidFlags)){
    const paidCount = typeof c.paid === 'number' ? c.paid : 0;
    c.paidFlags = Array.from({length:c.installments}, (_,i)=> i<paidCount);
  }
  if(c.paidFlags.length !== c.installments){
    const flags = Array.from({length:c.installments}, (_,i)=> !!c.paidFlags[i]);
    c.paidFlags = flags;
  }
  delete c.paid;
  return c;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = Object.assign(defaultState(), JSON.parse(raw));
      state.commitments = (state.commitments||[]).map(migrateCommitment);
    }
  }catch(e){ state = defaultState(); }
}

function scheduleEntryAt(purchaseJ, offset, ruleType, intervalDays, amount){
  if(ruleType === 'start_of_next_month'){
    const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, offset);
    return { jy:t.jy, jm:t.jm, jd:1, amount };
  }
  if(ruleType === 'monthly_fixed_day'){
    const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, offset);
    const day = Math.min(purchaseJ.jd, jMonthLength(t.jy,t.jm));
    return { jy:t.jy, jm:t.jm, jd:day, amount };
  }
  const step = ruleType === 'custom_interval' ? (intervalDays || 30) : 30;
  const jdn0 = j2d(purchaseJ.jy, purchaseJ.jm, purchaseJ.jd);
  const j = d2j(jdn0 + step*offset);
  return { jy:j.jy, jm:j.jm, jd:j.jd, amount };
}
function generateSchedule(purchaseJ, installments, perInstallment, ruleType, intervalDays, channel){
  const entries = [];
  let count = installments;
  if(channel === 'online'){
    entries.push({ jy:purchaseJ.jy, jm:purchaseJ.jm, jd:purchaseJ.jd, amount:perInstallment });
    count = installments - 1;
  }
  for(let p=0; p<count; p++){
    entries.push(scheduleEntryAt(purchaseJ, p+1, ruleType, intervalDays, perInstallment));
  }
  return entries;
}
function buildCommitmentSchedule(c){
  const sched = generateSchedule(c.purchaseDate, c.installments, c.monthly, c.scheduleType, c.intervalDays, c.channel);
  return sched.map((e,i) => Object.assign({}, e, { paid: !!(c.paidFlags && c.paidFlags[i]), index:i }));
}

function reliableMonthlyIncome(){
  return state.incomeSources.filter(s=>s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function variableMonthlyIncome(){
  return state.incomeSources.filter(s=>!s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function totalFixedExpenses(){ return state.fixedExpenses.reduce((sum,e)=>sum+e.amount,0); }
function cap(){ return Math.round(reliableMonthlyIncome() * state.installmentCapPercent / 100); }
function statusFromPercent(pct){
  if(pct > 100) return 'danger';
  if(pct > state.thresholds.safe) return pct > state.thresholds.caution ? 'danger' : 'caution';
  return 'safe';
}
function statusMeta(s){
  return { safe:{emoji:'🟢',label:'امن'}, caution:{emoji:'🟡',label:'احتیاط'}, danger:{emoji:'🔴',label:'پرریسک'} }[s];
}
function allEntries(includePending){
  const list = [];
  state.commitments.forEach(c=>{
    buildCommitmentSchedule(c).forEach(e=>{ if(!e.paid) list.push(e); });
  });
  if(includePending && state.pendingSimulation){
    generateSchedule(
      state.pendingSimulation.purchaseDate, state.pendingSimulation.installments,
      state.pendingSimulation.monthly, state.pendingSimulation.scheduleType,
      state.pendingSimulation.intervalDays, state.pendingSimulation.channel
    ).forEach(e=>list.push(e));
  }
  return list;
}
function commitmentForMonth(jy,jm,includePending){
  return allEntries(includePending).filter(e=>e.jy===jy && e.jm===jm).reduce((s,e)=>s+e.amount,0);
}
function nextMonths(n){
  const t = jToday();
  const out = [];
  for(let i=0;i<n;i++){ out.push(jAddMonths(t.jy,t.jm,i)); }
  return out;
}
function dueSoonEntries(withinDays){
  const t = jToday();
  const todayJdn = j2d(t.jy,t.jm,t.jd);
  const list = [];
  state.commitments.forEach(c=>{
    buildCommitmentSchedule(c).forEach((e,i)=>{
      if(e.paid) return;
      const diff = j2d(e.jy,e.jm,e.jd) - todayJdn;
      if(diff>=0 && diff<=withinDays) list.push({ commitment:c, entry:e, index:i, diff });
    });
  });
  return list.sort((a,b)=>a.diff-b.diff);
}

function gaugeSVG(percent, trackColor){
  const p = Math.max(0, Math.min(100, percent));
  const r = 76, len = Math.PI*r;
  const offset = len * (1 - p/100);
  let color = '#3FBE85';
  if(percent > state.thresholds.caution || percent > 100) color = '#F3A28E';
  else if(percent > state.thresholds.safe) color = '#DBE64C';
  return `<svg viewBox="0 0 200 108">
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${trackColor}" stroke-width="13" stroke-linecap="round"/>
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${len}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}

function requestNotifications(){
  if(!('Notification' in window)){ showToast('این مرورگر از نوتیفیکیشن پشتیبانی نمی‌کنه'); return; }
  Notification.requestPermission().then(perm=>{
    state.notificationsEnabled = perm === 'granted';
    saveState();
    showToast(perm==='granted' ? 'یادآوری اقساط فعال شد ✅' : 'اجازه داده نشد');
    renderProfile();
    checkDueNotifications();
  });
}
function checkDueNotifications(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const t = jToday();
  const key = NOTIF_KEY_PREFIX + j2d(t.jy,t.jm,t.jd);
  let already = [];
  try{ already = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
  dueSoonEntries(1).forEach(({commitment,entry,index,diff})=>{
    const flagId = commitment.id+'-'+index;
    if(already.includes(flagId)) return;
    try{
      new Notification('یادآوری قسط ظرفیت', {
        body: `${commitment.name}: ${toman(entry.amount)} ${diff===0?'امروز':'فردا'} سررسید داره`
      });
    }catch(e){}
    already.push(flagId);
  });
  try{ localStorage.setItem(key, JSON.stringify(already)); }catch(e){}
}

function togglePaid(commitmentId, idx){
  const c = state.commitments.find(x=>x.id===commitmentId);
  if(!c) return;
  if(!Array.isArray(c.paidFlags)) c.paidFlags = Array(c.installments).fill(false);
  c.paidFlags[idx] = !c.paidFlags[idx];
  saveState();
  showToast(c.paidFlags[idx] ? 'قسط پرداخت‌شده علامت خورد ✅' : 'به پرداخت‌نشده برگشت');
  renderCommitments();
}
function attachSwipeHandlers(root){
  root.querySelectorAll('.schedule-item[data-cid]').forEach(row=>{
    let startX=0, dx=0, dragging=false;
    const cid = row.dataset.cid, idx = parseInt(row.dataset.idx,10);
    row.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; }, {passive:true});
    row.addEventListener('touchmove', e=>{
      if(!dragging) return;
      dx = e.touches[0].clientX - startX;
      if(dx<0) row.style.transform = `translateX(${Math.max(dx,-90)}px)`;
    }, {passive:true});
    row.addEventListener('touchend', ()=>{
      dragging=false;
      row.style.transition='transform .2s ease';
      if(dx < -55) togglePaid(cid, idx);
      row.style.transform='';
      dx=0;
      setTimeout(()=>{ row.style.transition=''; },200);
    });
  });
}

    el.innerHTML = `${obDots()}
      <div class="step-title">چه روشی برای مدیریت پول دوست داری؟</div>
      <div class="step-sub">هر کدوم رو انتخاب کنی، درصدهاش کاملاً قابل تغییره.</div>
      <div id="tech-cards"></div>
      <div class="section-title">شخصی‌سازی درصدها</div>
      <div class="card mb18">
        <div class="row-2 mb14">
          <div><div class="field-label">نیازها ٪</div><input class="input num" id="tp-needs" type="number" placeholder="مثلاً ۵۰">
            <div class="hint num" id="tp-needs-amt"></div></div>
          <div><div class="field-label">خواسته‌ها ٪</div><input class="input num" id="tp-wants" type="number" placeholder="مثلاً ۳۰">
            <div class="hint num" id="tp-wants-amt"></div></div>
        </div>
        <div class="field-label">پس‌انداز ٪</div>
        <input class="input num" id="tp-savings" type="number" placeholder="مثلاً ۲۰">
        <div class="hint num" id="tp-savings-amt"></div>
        <div class="muted" id="tp-sum" style="font-size:11.5px; margin-top:10px;"></div>
      </div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-next">بعدی</button>
      </div>`;
    const reliable = obDraft.incomeSources.filter(s=>s.fixed).reduce((s,x)=>{
      const f = FREQUENCIES.find(y=>y.key===x.frequency); return s + x.amount*(f?f.factor:1);
    },0);
    function renderTechCards(){
      document.getElementById('tech-cards').innerHTML = TECHNIQUES.map(t=>`
        <div class="card mb14" data-tech="${t.key}" style="cursor:pointer; ${obDraft.technique.key===t.key?'border-color:var(--safe); background:var(--safe-soft);':''}">
          <div style="font-weight:800; font-size:13.5px; margin-bottom:4px;">${t.label}</div>
          <div class="muted" style="font-size:11.5px;">${t.desc}</div>
        </div>`).join('');
      document.querySelectorAll('[data-tech]').forEach(c=>c.onclick=()=>{
        const t = TECHNIQUES.find(x=>x.key===c.dataset.tech);
        obDraft.technique = { key:t.key, p:Object.assign({},t.p) };
        syncPercentInputs(); renderTechCards();
      });
    }
    function syncPercentInputs(){
      document.getElementById('tp-needs').value = obDraft.technique.p.needs;
      document.getElementById('tp-wants').value = obDraft.technique.p.wants;
      document.getElementById('tp-savings').value = obDraft.technique.p.savings;
      updateSum();
    }
    function updateSum(){
      const needs = parseInt(document.getElementById('tp-needs').value)||0;
      const wants = parseInt(document.getElementById('tp-wants').value)||0;
      const savings = parseInt(document.getElementById('tp-savings').value)||0;
      document.getElementById('tp-needs-amt').textContent = toman(reliable*needs/100);
      document.getElementById('tp-wants-amt').textContent = toman(reliable*wants/100);
      document.getElementById('tp-savings-amt').textContent = toman(reliable*savings/100);
      const sum = needs+wants+savings;
      const elSum = document.getElementById('tp-sum');
      elSum.textContent = sum===100 ? `مجموع: ${fa(sum)}٪ ✅` : `مجموع: ${fa(sum)}٪ — بهتره ۱۰۰٪ بشه`;
      elSum.style.color = sum===100 ? 'var(--safe)' : 'var(--danger)';
    }
    renderTechCards(); syncPercentInputs();
    ['tp-needs','tp-wants','tp-savings'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{
        obDraft.technique.p.needs = parseInt(document.getElementById('tp-needs').value)||0;
        obDraft.technique.p.wants = parseInt(document.getElementById('tp-wants').value)||0;
        obDraft.technique.p.savings = parseInt(document.getElementById('tp-savings').value)||0;
        obDraft.technique.key = 'custom';
        updateSum();
      });
    });
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-next').onclick = ()=>{ obStep++; renderOnboarding(); };
  }

  else if(obStep === 4){
    const reliable = obDraft.incomeSources.filter(s=>s.fixed).reduce((s,x)=>{
      const f = FREQUENCIES.find(y=>y.key===x.frequency); return s + x.amount*(f?f.factor:1);
    },0);
    const suggested = 30;
    el.innerHTML = `${obDots()}
      <div class="step-title">حداکثر چه درصدی از درآمدت رو حاضری صرف اقساط کنی؟</div>
      <div class="step-sub">بر اساس درآمد قابل‌اتکات (${toman(reliable)})، پیشنهاد ما ${fa(suggested)}٪ است؛ خودت می‌تونی تغییرش بدی.</div>
      <div class="card mb18">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
          <span id="cap-val" style="font-size:20px; font-weight:800; color:var(--safe);">${fa(obDraft.capPercent)}٪</span>
          <span class="field-label" style="margin:0;">سقف اقساط</span>
        </div>
        <input type="range" min="10" max="70" step="5" value="${obDraft.capPercent}" id="cap-slider">
        <div class="muted num" style="font-size:12px; margin-top:10px;">سقف محاسبه‌شده (تومان): <b id="cap-amount"></b></div>
      </div>
      <div class="section-title">آستانه‌های وضعیت (قابل تغییر)</div>
      <div class="card mb18">
        <div class="row-2">
          <div><div class="field-label">🟢 امن تا</div><input class="input num" type="number" id="th-safe" value="${obDraft.thresholds.safe}" placeholder="مثلاً ۳۰"></div>
          <div><div class="field-label">🟡 احتیاط تا</div><input class="input num" type="number" id="th-caution" value="${obDraft.thresholds.caution}" placeholder="مثلاً ۴۰"></div>
        </div>
        <div class="hint">بیشتر از آستانه‌ی احتیاط = 🔴 پرریسک</div>
      </div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-next">بعدی</button>
      </div>`;
    function updateCapDisplay(){
      document.getElementById('cap-val').textContent = fa(obDraft.capPercent) + '٪';
      document.getElementById('cap-amount').textContent = toman(reliable * obDraft.capPercent / 100);
    }
    updateCapDisplay();
    document.getElementById('cap-slider').addEventListener('input', e=>{
      obDraft.capPercent = parseInt(e.target.value,10); updateCapDisplay();
    });
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-next').onclick = ()=>{
      obDraft.thresholds.safe = parseInt(document.getElementById('th-safe').value,10) || 30;
      obDraft.thresholds.caution = parseInt(document.getElementById('th-caution').value,10) || 40;
      obStep++; renderOnboarding();
    };
  }

  else if(obStep === 5){
    el.innerHTML = `${obDots()}
      <div class="step-title">تعهدات مالی فعلیت رو ثبت کن</div>
      <div class="step-sub">هر وام، قسط، چک یا بدهی که الان داری. اگه چیزی نداری، رد کن بریم داشبورد.</div>
      <div class="card mb18" id="cm-form"></div>
      <div id="cm-list"></div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-finish">پایان و رفتن به داشبورد</button>
      </div>`;
    renderCommitmentForm(document.getElementById('cm-form'), null, (c)=>{
      obDraft.commitments.push(c); renderCmList();
    });
    function renderCmList(){
      document.getElementById('cm-list').innerHTML = obDraft.commitments.map(c=>{
        const t = COMMITMENT_TYPES.find(x=>x.key===c.type);
        const paidCount = c.paidFlags.filter(Boolean).length;
        return `<div class="list-row">
          <div class="emoji-badge">${t.emoji}</div>
          <div class="info"><div class="title">${c.name}</div><div class="sub">${fa(paidCount)}/${fa(c.installments)} قسط · ${toman(c.monthly)}</div></div>
          <button class="row-del" data-del="${c.id}">✕</button>
        </div>`;
      }).join('') || `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0 14px;">هنوز تعهدی اضافه نکردی</div>`;
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        obDraft.commitments = obDraft.commitments.filter(x=>x.id!==b.dataset.del);
        renderCmList();
      });
    }
    renderCmList();
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-finish').onclick = ()=>{
      state.incomeSources = obDraft.incomeSources;
      state.fixedExpenses = obDraft.fixedExpenses;
      state.technique = obDraft.technique;
      state.installmentCapPercent = obDraft.capPercent;
      state.thresholds = obDraft.thresholds;
      state.commitments = obDraft.commitments;
      state.onboarded = true;
      saveState();
      document.getElementById('bottom-nav').style.display = 'flex';
      goTo('home');
    };
  }
}

function renderCommitmentForm(container, existing, onSave){
  const isEdit = !!existing;
  const today = jToday();
  const startDate = isEdit ? existing.purchaseDate : today;
  container.innerHTML = `
    <div class="field-label">نام تعهد</div>
    <input class="input mb14" id="cf-name" placeholder="مثلاً گوشی، وام بانک، چک اجاره" value="${isEdit?existing.name:''}">
    <div class="field-label">نوع</div>
    <div class="chip-grid mb14" id="cf-types">
      ${COMMITMENT_TYPES.map(t=>`<div class="chip ${isEdit&&existing.type===t.key?'selected':''}" data-type="${t.key}">${t.emoji} ${t.label}</div>`).join('')}
    </div>
    <div class="row-2 mb14">
      <div><div class="field-label">مبلغ کل (تومان)</div><input class="input amt-input num" id="cf-total" inputmode="numeric" placeholder="مثلاً ۴٬۰۰۰٬۰۰۰" value="${isEdit?fa(existing.total):''}"></div>
      <div><div class="field-label">تعداد اقساط</div><input class="input num" id="cf-installments" type="number" min="1" value="${isEdit?existing.installments:4}" placeholder="مثلاً ۴"></div>
    </div>
    <div class="field-label">نحوه خرید</div>
    <div class="chip-grid mb14" id="cf-channel">
      ${CHANNELS.map(ch=>`<div class="chip ${(isEdit?existing.channel:'in_person')===ch.key?'selected':''}" data-channel="${ch.key}">${ch.label}</div>`).join('')}
    </div>
    <div class="hint mb14" id="cf-channel-hint"></div>
    ${!isEdit ? `
    <div class="field-label">چند قسط قبلاً پرداخت شده؟</div>
    <input class="input num mb14" id="cf-paid" type="number" min="0" value="0" placeholder="مثلاً ۰">
    <div class="hint mb14">اگه این تعهد از قبل شروع شده و چند قسطش رو دادی، اینجا وارد کن</div>` : ''}
    <div class="field-label">تاریخ خرید/شروع</div>
    ${jalaliPickerHTML('cf-date', startDate)}
    <div class="mb14"></div>
    <div class="field-label">سرویس / نوع زمان‌بندی</div>
    <select class="input mb14" id="cf-provider">
      ${PROVIDERS.map(p=>`<option value="${p.key}" ${isEdit&&existing.scheduleType===p.rule?'selected':''}>${p.label} — ${SCHEDULE_LABELS[p.rule]}</option>`).join('')}
    </select>
    <div id="cf-interval-wrap" style="display:none;" class="mb14">
      <div class="field-label">فاصله بین اقساط (روز)</div>
      <input class="input num" id="cf-interval" type="number" value="${isEdit?(existing.intervalDays||30):30}" placeholder="مثلاً ۳۰">
    </div>
    <div class="field-label">ضرورت</div>
    <div class="chip-grid mb14" id="cf-necessity">
      ${NECESSITY.map(n=>`<div class="chip ${(isEdit?existing.necessity:'req')===n.key?'selected':''}" data-nec="${n.key}">${n.label}</div>`).join('')}
    </div>
    <button class="btn ${isEdit?'btn-primary':'btn-ghost'}" id="cf-add">${isEdit?'ذخیره تغییرات':'+ افزودن تعهد'}</button>
  `;
  wireAmountInputs(container);
  initJalaliPicker('cf-date', startDate);

  let selType = isEdit ? existing.type : 'bnpl';
  let selNec = isEdit ? existing.necessity : 'req';
  let selChannel = isEdit ? existing.channel : 'in_person';

  function updateChannelHint(){
    const ch = CHANNELS.find(c=>c.key===selChannel);
    container.querySelector('#cf-channel-hint').textContent = ch.hint;
  }
  updateChannelHint();

  container.querySelectorAll('[data-type]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selType = c.dataset.type;
  });
  container.querySelectorAll('[data-nec]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-nec]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selNec = c.dataset.nec;
  });
  container.querySelectorAll('[data-channel]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-channel]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selChannel = c.dataset.channel;
    updateChannelHint();
  });
  container.querySelector('#cf-provider').addEventListener('change', e=>{
    const p = PROVIDERS.find(x=>x.key===e.target.value);
    container.querySelector('#cf-interval-wrap').style.display = p.rule==='custom_interval' ? 'block':'none';
  });
  if(isEdit){
    const p = PROVIDERS.find(x=>x.rule===existing.scheduleType);
    if(p && p.rule==='custom_interval') container.querySelector('#cf-interval-wrap').style.display='block';
  }

  container.querySelector('#cf-add').onclick = ()=>{
    const name = container.querySelector('#cf-name').value.trim();
    const total = parseFaNumber(container.querySelector('#cf-total').value);
    const installments = Math.max(1, parseInt(container.querySelector('#cf-installments').value,10) || 1);
    const providerKey = container.querySelector('#cf-provider').value;
    const provider = PROVIDERS.find(p=>p.key===providerKey);
    const interval = parseInt(container.querySelector('#cf-interval').value,10) || 30;
    const purchaseDate = readJalaliPicker('cf-date');
    if(!name || !total){ showToast('نام و مبلغ کل رو وارد کن'); return; }
    const monthly = Math.round(total / installments);

    let paidFlags;
    if(isEdit){
      paidFlags = existing.paidFlags.length===installments
        ? existing.paidFlags
        : Array.from({length:installments}, (_,i)=> !!existing.paidFlags[i]);
    } else {
      const paidCount = Math.min(parseInt(container.querySelector('#cf-paid').value,10) || 0, installments);
      paidFlags = Array.from({length:installments}, (_,i)=> i<paidCount);
      if(selChannel==='online' && installments>0) paidFlags[0] = true;
    }

    onSave({
      id: isEdit ? existing.id : uid(), name, type: selType, total, installments, monthly,
      provider: provider.label, scheduleType: provider.rule, intervalDays: interval,
      purchaseDate, necessity: selNec, channel: selChannel, paidFlags
    });
  };
}

  checkDueNotifications();

      renderCommitments();
    });
    return;

  const filters = [{key:'all',label:'همه'}].concat(COMMITMENT_TYPES.map(t=>({key:t.key,label:t.emoji+' '+t.label})));

              <div class="title">${cm.name}</div>
              <div class="sub">${cm.provider} · ${fa(paidCount)}/${fa(cm.installments)} قسط پرداخت‌شده</div>
            </div>
            <div style="text-align:left;">

              <span class="badge-necessity ${necClass}">${nec.label}</span>
            </div>
          </div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <span class="badge-channel">${channelInfo.label}</span>

            <button class="row-del" data-delcm="${cm.id}">✕</button>

            <div class="waterfall-row"><span class="l">مبلغ کل</span><span class="r num">${toman(cm.total)}</span></div>
            <div class="waterfall-row"><span class="l">اثر روی ظرفیت ماهانه</span><span class="r num">${fa(impactPct)}٪</span></div>
            <div class="waterfall-row"><span class="l">پرداخت بعدی</span><span class="r">${next ? fmtJDate(next) : '—'}</span></div>
            <div class="field-label" style="margin-top:10px;">همه‌ی اقساط — بکش به چپ یا بزن تا تیک بخوره</div>
            ${schedule.map((e,i)=>`<div class="schedule-swipe-wrap">
              <div class="schedule-swipe-hint">✓ پرداخت شد</div>
              <div class="schedule-item ${e.paid?'paid-row':''}" data-cid="${cm.id}" data-idx="${i}">
                <span class="${e.paid?'paid':''}"><span class="check">${e.paid?'☑️':'⬜️'}</span>قسط ${fa(i+1)} — ${fmtJDate(e)}</span>
                <span class="num ${e.paid?'paid':''}">${fa(e.amount)}</span>
              </div>
            </div>`).join('')}
          </div>
        </div>`;
      }).join('') || `<div class="muted" style="text-align:center; padding:40px 0; font-size:13px;">تعهدی در این دسته نیست</div>`}
    </div>
  `;

  document.getElementById('cm-new').onclick = ()=>{ commitEditTarget='new'; renderCommitments(); };
  document.querySelectorAll('#commit-filters [data-f]').forEach(chip=>chip.onclick=()=>{
    commitFilter = chip.dataset.f; renderCommitments();
  });
  document.querySelectorAll('[data-open]').forEach(row=>{

function renderPlanTechnique(){
  const tech = TECHNIQUES.find(t=>t.key===state.technique.key) || TECHNIQUES[TECHNIQUES.length-1];
  const income = reliableMonthlyIncome();
  document.getElementById('plan-technique').innerHTML = `
    <div class="card mb18">
      <div class="eyebrow">تکنیک انتخابی</div>
      <div style="font-size:15px; font-weight:800; margin-bottom:4px;">${tech.label}</div>

      <div class="waterfall-row"><span class="l">🛍️ خواسته‌ها (${fa(state.technique.p.wants)}٪)</span><span class="r num">${toman(income*state.technique.p.wants/100)}</span></div>
      <div class="waterfall-row"><span class="l">💚 پس‌انداز (${fa(state.technique.p.savings)}٪)</span><span class="r num">${toman(income*state.technique.p.savings/100)}</span></div>
    </div>
    <button class="btn btn-ghost" data-nav="profile">ویرایش تکنیک و درصدها</button>
  `;
  document.querySelectorAll('#plan-technique [data-nav]').forEach(el=>el.addEventListener('click', ()=>goTo('profile')));
}

function renderPlanCalendar(){
  const months = nextMonths(6);
  const income = reliableMonthlyIncome();
  const fixed = totalFixedExpenses();
  const savingsPct = state.technique.p.savings || 0;
  document.getElementById('plan-calendar').innerHTML = months.map(m=>{
    const installments = commitmentForMonth(m.jy,m.jm,false);
    const savings = Math.round(income*savingsPct/100);
    const available = Math.round(income - fixed - installments - savings);
    const dueEntries = allEntries(false).filter(e=>e.jy===m.jy && e.jm===m.jm).sort((a,b)=>a.jd-b.jd);
    return `<div class="cal-month-card">
      <div class="cal-month-head"><span class="name">${MONTH_NAMES[m.jm]} ${fa(m.jy)}</span>
        <span class="num" style="font-size:11px; color:var(--muted);">${toman(available)} آزاد</span></div>
      <div class="waterfall-row"><span class="l">درآمد</span><span class="r num">${toman(income)}</span></div>
      <div class="waterfall-row"><span class="l">هزینه ثابت</span><span class="r num">${toman(fixed)}</span></div>
      <div class="waterfall-row"><span class="l">اقساط</span><span class="r num">${toman(installments)}</span></div>
      <div class="waterfall-row"><span class="l">پس‌انداز</span><span class="r num">${toman(savings)}</span></div>
      ${dueEntries.length ? `<div class="field-label" style="margin-top:10px;">سررسیدها</div>` + dueEntries.map(e=>
        `<div class="cal-due-row"><span>${fa(e.jd)} ${MONTH_NAMES[e.jm]}</span><span class="num">${fa(e.amount)}</span></div>`).join('') : ''}
    </div>`;
  }).join('');
}

function renderPlanCashflow(){
  const t = jToday();
  const income = reliableMonthlyIncome() + variableMonthlyIncome();
  const fixed = totalFixedExpenses();
  const installments = commitmentForMonth(t.jy,t.jm,false);
  const savings = Math.round(reliableMonthlyIncome() * (state.technique.p.savings||0) / 100);
  const available = Math.round(income - fixed - installments - savings);
  document.getElementById('plan-cashflow').innerHTML = `
    <div class="card">
      <div class="eyebrow">جریان نقدی ${MONTH_NAMES[t.jm]} ${fa(t.jy)}</div>
      <div class="waterfall-row"><span class="l">💰 درآمد</span><span class="r num">${toman(income)}</span></div>
      <div class="waterfall-arrow">↓</div>
      <div class="waterfall-row"><span class="l">🧾 هزینه‌های ثابت</span><span class="r num">-${fa(fixed)}</span></div>
      <div class="waterfall-arrow">↓</div>
      <div class="waterfall-row"><span class="l">📆 اقساط</span><span class="r num">-${fa(installments)}</span></div>
      <div class="waterfall-arrow">↓</div>
      <div class="waterfall-row"><span class="l">💚 پس‌انداز</span><span class="r num">-${fa(savings)}</span></div>
      <div class="waterfall-arrow">↓</div>
      <div class="waterfall-row total"><span class="l">✅ پول آزاد پایان ماه</span>
        <span class="r num" style="color:${available>=0?'var(--safe)':'var(--danger)'}">${toman(Math.abs(available))}</span></div>
    </div>`;
}

      needs: parseInt(document.getElementById('pf-p-needs').value,10)||0,
      wants: parseInt(document.getElementById('pf-p-wants').value,10)||0,
      savings: parseInt(document.getElementById('pf-p-savings').value,10)||0
    };
    saveState();
    showToast('تغییرات ذخیره شد ✅');
    goTo('home');
  };
  document.getElementById('pf-reset').onclick = ()=>{
    if(!confirm('همه‌ی اطلاعات پاک بشه و از اول شروع کنیم؟')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    location.reload();
  };
}

function renderSimStart(){
  const today = jToday();
  const el = document.getElementById('sim-content');
  el.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" data-nav="home"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#001F3F" stroke-width="2" stroke-linecap="round"/></svg></div>
      <h2 style="font-size:17px;">قبل از خرید بررسی کن</h2>
    </div>
    <div class="field-label">قیمت کالا</div>
    <div class="card mb18" style="text-align:center;">
      <input class="input amt-input num" id="sm-price" inputmode="numeric" placeholder="مثلاً ۳٬۰۰۰٬۰۰۰"
        style="border:none; text-align:center; font-size:28px; font-weight:800; padding:6px;">
      <div class="muted" style="font-size:12px;">تومان</div>
    </div>
    <div class="field-label">تعداد اقساط (۱ = نقدی)</div>
    <input class="input mb18" id="sm-installments" type="number" min="1" value="4" placeholder="مثلاً ۴">
    <div class="field-label">نحوه خرید</div>
    <div class="chip-grid mb14" id="sm-channel">
      ${CHANNELS.map((ch,i)=>`<div class="chip ${i===1?'selected':''}" data-channel="${ch.key}">${ch.label}</div>`).join('')}
    </div>
    <div class="hint mb18" id="sm-channel-hint"></div>
    <div class="field-label">سرویس / زمان‌بندی</div>
    <select class="input mb14" id="sm-provider">
      ${PROVIDERS.map(p=>`<option value="${p.key}">${p.label} — ${SCHEDULE_LABELS[p.rule]}</option>`).join('')}
    </select>
    <div id="sm-interval-wrap" style="display:none;" class="mb18">
      <div class="field-label">فاصله بین اقساط (روز)</div>
      <input class="input num" id="sm-interval" type="number" value="30" placeholder="مثلاً ۳۰">
    </div>
    <div class="field-label">تاریخ خرید</div>
    ${jalaliPickerHTML('sm-date', today)}
    <div class="mb18"></div>
    <div class="field-label">این خرید چقدر ضروریه؟</div>
    <div class="chip-grid mb22" id="sm-necessity">
      ${NECESSITY.map((n,i)=>`<div class="chip ${i===0?'selected':''}" data-nec="${n.key}">${n.label}</div>`).join('')}
    </div>
    <button class="btn btn-primary" id="sm-check">بررسی خرید</button>
  `;
  wireAmountInputs(el);
  initJalaliPicker('sm-date', today);

  let selNec = 'req', selChannel = 'in_person';
  function updateChannelHint(){
    document.getElementById('sm-channel-hint').textContent = CHANNELS.find(c=>c.key===selChannel).hint;
  }
  updateChannelHint();
  el.querySelectorAll('[data-channel]').forEach(c=>c.onclick=()=>{
    el.querySelectorAll('[data-channel]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selChannel = c.dataset.channel; updateChannelHint();
  });
  el.querySelectorAll('[data-nec]').forEach(c=>c.onclick=()=>{
    el.querySelectorAll('[data-nec]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selNec = c.dataset.nec;
  });
  document.getElementById('sm-provider').addEventListener('change', e=>{
    const p = PROVIDERS.find(x=>x.key===e.target.value);
    document.getElementById('sm-interval-wrap').style.display = p.rule==='custom_interval' ? 'block':'none';
  });
  document.getElementById('sm-check').onclick = ()=>{
    const price = parseFaNumber(document.getElementById('sm-price').value);
    if(!price){ showToast('قیمت کالا رو وارد کن'); return; }
    const installments = Math.max(1, parseInt(document.getElementById('sm-installments').value,10) || 1);
    const providerKey = document.getElementById('sm-provider').value;
    const provider = PROVIDERS.find(p=>p.key===providerKey);
    const interval = parseInt(document.getElementById('sm-interval').value,10) || 30;
    const purchaseDate = readJalaliPicker('sm-date');
    const monthly = installments===1 ? 0 : Math.round(price/installments);
    state.pendingSimulation = {
      price, installments, monthly, provider: provider.label,
      scheduleType: installments===1 ? null : provider.rule, intervalDays: interval,
      purchaseDate, necessity: selNec, channel: selChannel
    };
    renderSimResult();
  };
}

function renderSimResult(){
  const p = state.pendingSimulation;
  const el = document.getElementById('sim-content');
  const isCash = p.installments === 1;
  const c = cap();

  let scheduleEntries = [];
  let worst = { pct:0, jy:0, jm:0, val:0 };
  if(!isCash){
    scheduleEntries = generateSchedule(p.purchaseDate, p.installments, p.monthly, p.scheduleType, p.intervalDays, p.channel);
    const months = nextMonths(Math.max(6, p.installments+1));
    months.forEach(m=>{
      const existing = commitmentForMonth(m.jy,m.jm,false);
      const withNew = scheduleEntries.filter(e=>e.jy===m.jy&&e.jm===m.jm).reduce((s,e)=>s+e.amount,0);
      const total = existing + withNew;
      const pct = c>0 ? (total/c)*100 : 0;
      if(pct > worst.pct) worst = { pct, jy:m.jy, jm:m.jm, val: total };
    });
  }
  const status = isCash ? 'safe' : statusFromPercent(worst.pct);
  const sm = statusMeta(status);
  const necLabel = NECESSITY.find(n=>n.key===p.necessity).label;
  const necClass = p.necessity==='req'?'req':p.necessity==='semi'?'semi':'optional';

  el.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" id="sm-back"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#001F3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 style="font-size:17px;">نتیجه بررسی</h2>
    </div>

    <div class="card mb18" style="text-align:center; background:${status==='safe'?'var(--safe-soft)':status==='caution'?'var(--caution-soft)':'var(--danger-soft)'}; border:none;">
      <div style="font-size:30px; margin-bottom:6px;">${isCash?'🟢':sm.emoji}</div>
      <div style="font-size:17px; font-weight:800; color:${status==='safe'?'var(--safe)':status==='caution'?'var(--caution)':'var(--danger)'}; margin-bottom:5px;">
        ${isCash ? 'خرید امن' : (status==='safe'?'خرید امن':status==='caution'?'خرید با احتیاط':'فشار مالی بالا')}
      </div>
      <div class="muted" style="font-size:12.5px; line-height:1.7;">
        ${isCash ? 'این خرید نقدی است و تعهد اقساطی جدیدی ایجاد نمی‌کند.' :
          `پرفشارترین ماه، ${MONTH_NAMES[worst.jm]} است — ${fa(Math.round(worst.pct))}٪ از سقف آن ماه.`}
      </div>
      <span class="badge-necessity ${necClass}" style="margin-top:10px; display:inline-block;">${necLabel}</span>
    </div>

    ${!isCash ? `
    <div class="card mb18">
      <div class="waterfall-row"><span class="l">قسط ماهانه</span><span class="r num">${toman(p.monthly)}</span></div>
      <div class="waterfall-row"><span class="l">سقف اقساط</span><span class="r num">${toman(c)}</span></div>
      <div class="waterfall-row"><span class="l">نحوه خرید</span><span class="r">${CHANNELS.find(ch=>ch.key===p.channel).label}</span></div>
      <div class="waterfall-row"><span class="l">سرویس / زمان‌بندی</span><span class="r">${SCHEDULE_LABELS[p.scheduleType]}</span></div>
    </div>

    <div class="section-title">زمان‌بندی اقساط</div>
    <div class="card mb18">
      ${scheduleEntries.map((e,i)=>`<div class="schedule-item" style="border-top:${i===0?'none':'1px dashed var(--line)'}"><span>قسط ${fa(i+1)} — ${fmtJDate(e)}</span><span class="num">${fa(e.amount)}</span></div>`).join('')}
    </div>

    <div class="section-title">اثر روی ماه‌های آینده</div>
    <div class="month-strip mb18">
      ${nextMonths(4).map(m=>{
        const existing = commitmentForMonth(m.jy,m.jm,false);
        const withNew = scheduleEntries.filter(e=>e.jy===m.jy&&e.jm===m.jm).reduce((s,e)=>s+e.amount,0);
        const total = existing+withNew;
        const pct = c>0 ? Math.min(100,(total/c)*100) : 0;
        const s2 = statusFromPercent(pct);
        const color = s2==='safe'?'var(--safe)':s2==='caution'?'#B08A00':'var(--danger)';
        return `<div class="month-pill"><div class="mname">${MONTH_NAMES[m.jm]}</div>
          <div class="mbar"><div class="mbar-fill" style="width:${pct}%; background:${color}"></div></div>
          <div class="mval num">${fa(total)}</div></div>`;
      }).join('')}
    </div>` : ''}

    <div class="step-actions">
      ${status==='danger' ? `
        <button class="btn btn-ghost" id="sm-cancel">منصرف شدم</button>
        <button class="btn btn-outline-danger" id="sm-confirm">ادامه خرید</button>
      ` : `
        <button class="btn btn-primary" id="sm-confirm">ادامه خرید</button>
        <button class="btn btn-ghost" id="sm-cancel">منصرف شدم</button>
      `}
    </div>
  `;
  document.getElementById('sm-back').onclick = ()=>{ state.pendingSimulation=null; renderSimStart(); };
  document.getElementById('sm-cancel').onclick = ()=>{
    state.pendingSimulation = null; showToast('خرید ثبت نشد'); goTo('home');
  };
  document.getElementById('sm-confirm').onclick = ()=>{
    if(!isCash){
      const paidFlags = Array(p.installments).fill(false);
      if(p.channel==='online') paidFlags[0] = true;
      state.commitments.unshift({
        id: uid(), name:'خرید جدید', type:'bnpl', total:p.price, installments:p.installments,
        monthly:p.monthly, provider:p.provider, scheduleType:p.scheduleType, intervalDays:p.intervalDays,
        purchaseDate:p.purchaseDate, necessity:p.necessity, channel:p.channel, paidFlags
      });
    }
    state.pendingSimulation = null;
    saveState();
    showToast('خرید با موفقیت ثبت شد ✅');
    goTo('commitments');
  };
}

loadState();
if(state.onboarded){
  document.getElementById('bottom-nav').style.display = 'flex';
  goTo('home');
} else {
  renderOnboarding();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
