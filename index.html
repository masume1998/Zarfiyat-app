<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ظرفیت | دستیار تصمیم‌گیری مالی شخصی</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ظرفیت">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap">
<style>
  :root{
    --ink:#12261F; --ink-soft:#3C4A40; --muted:#748076;
    --paper:#EFF2EB; --paper-deep:#E4E9DF; --surface:#FFFFFF; --line:#DDE3D6;
    --safe:#1E7355; --safe-soft:#E4F1EA;
    --caution:#AD7A2E; --caution-soft:#F5ECDA;
    --danger:#B3402A; --danger-soft:#F6E4DF;
    --track:#E3E7DE;
    --shadow: 0 18px 40px -18px rgba(18,38,31,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background: radial-gradient(circle at 18% -10%, #DCE7DC 0%, transparent 55%),
      radial-gradient(circle at 100% 110%, #E9E2D2 0%, transparent 45%), #DCE2D6;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px; color:var(--ink);
  }
  ::selection{ background: var(--safe); color:#fff; }
  h1,h2,h3{ font-weight:800; letter-spacing:-.01em; }
  .num{ font-variant-numeric: tabular-nums; }
  .eyebrow{ font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }

  .device{
    width:100%; max-width:400px; height:840px; max-height:92vh;
    background:var(--paper); border-radius:44px; border:10px solid var(--ink);
    box-shadow: var(--shadow), 0 0 0 2px rgba(18,38,31,.06);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:var(--ink); border-radius:0 0 16px 16px; z-index:30; }
  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .device{ width:100vw; max-width:none; height:100vh; height:100dvh; max-height:none;
      border:none; border-radius:0; box-shadow:none; }
    .notch{ display:none; }
    .bottom-nav{ padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }

  .screens{ flex:1; position:relative; overflow:hidden; }
  .screen{ position:absolute; inset:0; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;
    padding:30px 20px 110px; opacity:0; visibility:hidden; transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease; }
  .screen::-webkit-scrollbar{ display:none; }
  .screen.active{ opacity:1; visibility:visible; transform:translateY(0); }

  .card{ background:var(--surface); border-radius:22px; padding:20px; border:1px solid var(--line); }
  .card + .card{ margin-top:14px; }
  .section-title{ font-size:14px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .section-title span.link{ font-size:12px; font-weight:600; color:var(--safe); cursor:pointer; }
  .muted{ color:var(--muted); }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px;
    border-radius:100px; border:none; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--safe); color:#fff; }
  .btn-ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-sm{ padding:10px 16px; font-size:13px; width:auto; }
  .btn-outline-danger{ background:transparent; color:var(--danger); border:1px solid rgba(179,64,42,.35); }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  .field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .input, select.input, .date-field{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
  }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; }
  .mb14{ margin-bottom:14px; } .mb18{ margin-bottom:18px; } .mb22{ margin-bottom:22px; }

  .chip{ padding:9px 14px; border-radius:100px; border:1.4px solid var(--line); background:var(--surface);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip.selected{ border-color:var(--safe); background:var(--safe-soft); color:var(--safe); }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }

  .list-row{ display:flex; align-items:center; gap:12px; padding:13px 0; }
  .list-row + .list-row{ border-top:1px dashed var(--line); }
  .list-row .emoji-badge{ width:38px; height:38px; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .title{ font-size:13.5px; font-weight:700; }
  .list-row .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .list-row .amount{ font-size:13.5px; font-weight:800; }
  .row-del{ width:26px; height:26px; border-radius:50%; background:var(--paper-deep); border:none;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; cursor:pointer; flex:0 0 auto;}

  /* stepper */
  .step-dots{ display:flex; gap:6px; margin-bottom:22px; justify-content:center; }
  .step-dots span{ width:26px; height:4px; border-radius:4px; background:var(--track); }
  .step-dots span.done{ background:var(--safe); }
  .step-dots span.now{ background:var(--ink); }
  .step-title{ font-size:20px; font-weight:800; margin-bottom:6px; }
  .step-sub{ font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.7; }
  .step-actions{ position:sticky; bottom:0; background:linear-gradient(0deg,var(--paper) 65%,transparent);
    padding-top:16px; display:flex; gap:10px; }

  /* gauge */
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin:10px 0 2px; position:relative; }
  .gauge-figure{ position:relative; width:200px; }
  .gauge-figure svg{ width:100%; display:block; }
  .gauge-center{ position:absolute; left:0; right:0; bottom:4px; text-align:center; }
  .gauge-center .big{ font-size:24px; font-weight:800; }
  .gauge-center .small{ font-size:11px; color:var(--muted); }

  .status-chip{ font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; display:inline-flex; align-items:center; gap:5px; }
  .status-chip.safe{ background:var(--safe-soft); color:var(--safe); }
  .status-chip.caution{ background:var(--caution-soft); color:var(--caution); }
  .status-chip.danger{ background:var(--danger-soft); color:var(--danger); }
  .status-chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .month-strip{ display:flex; gap:9px; overflow-x:auto; padding-bottom:2px; }
  .month-pill{ flex:0 0 auto; width:92px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center; }
  .month-pill .mname{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .mbar{ height:6px; border-radius:100px; background:var(--track); overflow:hidden; margin-bottom:7px; }
  .mbar-fill{ height:100%; border-radius:100px; }
  .month-pill .mval{ font-size:11.5px; font-weight:700; }

  .segmented{ display:flex; background:var(--paper-deep); border-radius:100px; padding:3px; margin-bottom:18px; }
  .segmented button{ flex:1; border:none; background:transparent; padding:9px 6px; border-radius:100px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:0 2px 6px rgba(18,38,31,.08); }

  .waterfall-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; }
  .waterfall-row + .waterfall-row{ border-top:1px dashed var(--line); }
  .waterfall-row .l{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .waterfall-row .r{ font-size:14.5px; font-weight:800; }
  .waterfall-row.total .r{ font-size:17px; }
  .waterfall-arrow{ text-align:center; color:var(--line); font-size:12px; }

  .cal-month-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .cal-month-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-month-head .name{ font-size:14.5px; font-weight:800; }
  .cal-due-row{ display:flex; justify-content:space-between; font-size:11.5px; padding:4px 0; color:var(--ink-soft); }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; }
  .filter-chip{ padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .filter-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{ position:absolute; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:100px; font-size:12px; font-weight:700;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bottom-nav{ position:relative; z-index:20; background:var(--surface); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around; padding:10px 8px 16px; }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:10px; font-weight:700; color:var(--muted); cursor:pointer; padding:4px 6px; }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--safe); }
  .nav-fab{ width:52px; height:52px; border-radius:50%; background:var(--safe); color:#fff; display:flex;
    align-items:center; justify-content:center; border:none; margin-top:-30px;
    box-shadow:0 10px 22px -6px rgba(30,115,85,.55); cursor:pointer; }
  .nav-fab svg{ width:22px; height:22px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .badge-necessity{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .badge-necessity.req{ background:var(--safe-soft); color:var(--safe); }
  .badge-necessity.semi{ background:var(--caution-soft); color:var(--caution); }
  .badge-necessity.optional{ background:var(--danger-soft); color:var(--danger); }

  .schedule-list{ margin-top:10px; }
  .schedule-item{ display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-top:1px dashed var(--line); }
  .schedule-item .paid{ color:var(--muted); text-decoration:line-through; }

  input[type="range"]{ -webkit-appearance:none; width:100%; height:6px; border-radius:100px; background:var(--track); outline:none; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--safe); border:4px solid #fff; box-shadow:0 2px 8px rgba(30,115,85,.4); cursor:pointer; }
</style>
</head>
<body>

<div class="device">
  <div class="notch"></div>
  <div class="screens">

    <!-- ================= ONBOARDING ================= -->
    <div class="screen active" id="screen-ob">
      <div id="ob-steps"></div>
    </div>

    <!-- ================= HOME ================= -->
    <div class="screen" id="screen-home">
      <div class="topbar">
        <div class="icon-btn" data-nav="profile">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#12261F" stroke-width="1.8"/><path d="M5 20c1.6-3.6 4.4-5.4 7-5.4S17.4 16.4 19 20" stroke="#12261F" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <b style="font-size:14px;">ظرفیت</b>
          <div style="width:28px; height:28px; border-radius:9px; background:var(--ink); display:flex; align-items:center; justify-content:center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 15c2-6 6-9 8-9s6 3 8 9" stroke="#EFF2EB" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="#EFF2EB"/></svg>
          </div>
        </div>
      </div>

      <div id="home-greeting" class="step-title" style="font-size:21px;"></div>
      <div class="muted" style="font-size:13px; margin-bottom:18px;">قبل از خرج کردن، ببین این تصمیم چه اثری روی آینده‌ات داره</div>

      <div class="card" style="background:linear-gradient(160deg,var(--ink) 0%, #1E3A2F 100%); border:none; color:#fff; position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <span id="home-status-chip" class="status-chip safe"><span class="dot"></span> امن</span>
          <span class="eyebrow" style="color:rgba(255,255,255,.6); margin:0;">سقف امن اقساط این ماه</span>
        </div>
        <div class="gauge-wrap"><div class="gauge-figure" id="home-gauge"></div></div>
        <div style="height:8px; border-radius:100px; background:rgba(255,255,255,.12); overflow:hidden; position:relative;">
          <div id="home-progress-fill" style="height:100%; border-radius:100px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:9px; font-size:11.5px; color:rgba(255,255,255,.68);">
          <span>سقف: <b id="home-cap" class="num" style="color:#fff;"></b></span>
          <span>اقساط این ماه: <b id="home-used" class="num" style="color:#fff;"></b></span>
        </div>
      </div>

      <div class="section-title">وضعیت درآمد و هزینه</div>
      <div class="card">
        <div class="waterfall-row"><span class="l">💰 درآمد قابل‌اتکا</span><span class="r num" id="home-reliable"></span></div>
        <div class="waterfall-row"><span class="l">🎲 درآمد متغیر (میانگین)</span><span class="r num" id="home-variable"></span></div>
        <div class="waterfall-row"><span class="l">🧾 هزینه‌های ثابت</span><span class="r num" id="home-fixed"></span></div>
        <div class="waterfall-row total"><span class="l">🟢 ظرفیت باقی‌مانده اقساط</span><span class="r num" id="home-remaining" style="color:var(--safe)"></span></div>
      </div>

      <div class="section-title">تعهدات ماه‌های آینده <span class="link" data-nav="plan">مشاهده تقویم</span></div>
      <div class="month-strip" id="home-months"></div>

      <button class="btn btn-primary" style="margin-top:22px;" id="home-cta">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        قبل از خرید بررسی کن
      </button>
    </div>

    <!-- ================= COMMITMENTS ================= -->
    <div class="screen" id="screen-commitments">
      <div class="topbar"><h2 style="font-size:18px;">تعهدات مالی</h2></div>
      <div class="filter-row" id="commit-filters"></div>
      <div id="commit-list"></div>
    </div>

    <!-- ================= PLAN ================= -->
    <div class="screen" id="screen-plan">
      <div class="topbar"><h2 style="font-size:18px;">برنامه مالی</h2></div>
      <div class="segmented" id="plan-segmented">
        <button data-seg="technique" class="active">تکنیک بودجه</button>
        <button data-seg="calendar">تقویم</button>
        <button data-seg="cashflow">جریان نقدی</button>
      </div>
      <div id="plan-technique"></div>
      <div id="plan-calendar" style="display:none;"></div>
      <div id="plan-cashflow" style="display:none;"></div>
    </div>

    <!-- ================= PROFILE ================= -->
    <div class="screen" id="screen-profile">
      <div class="topbar"><h2 style="font-size:18px;">پروفایل و تنظیمات</h2></div>
      <div id="profile-content"></div>
    </div>

    <!-- ================= SIMULATOR ================= -->
    <div class="screen" id="screen-sim">
      <div id="sim-content"></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-btn active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      خانه
    </button>
    <button class="nav-btn" data-nav="commitments">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      تعهدات
    </button>
    <button class="nav-fab" data-nav="sim">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="nav-btn" data-nav="plan">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      برنامه
    </button>
    <button class="nav-btn" data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.6-3.6 4.4-5.4 7-5.4S17.4 16.4 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      پروفایل
    </button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   1) JALALI (PERSIAN) CALENDAR ENGINE
   Standard jalaali conversion algorithm (Julian-day based).
========================================================= */
function jdiv(a,b){ return Math.trunc(a/b); }
function jmod(a,b){ return a - Math.trunc(a/b)*b; }

function g2d(gy,gm,gd){
  let d = jdiv((gy + jdiv(gm-8,6) + 100100)*1461,4) + jdiv(153*jmod(gm+9,12)+2,5) + gd - 34840408;
  d = d - jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4*jdn + 139361631;
  j = j + jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4 - 3908;
  const i = jdiv(jmod(j,1461),4)*5 + 308;
  const gd = jdiv(jmod(i,153),5) + 1;
  const gm = jmod(jdiv(i,153),12) + 1;
  const gy = jdiv(j,1461) - 100100 + jdiv(8-gm,6);
  return {gy,gm,gd};
}
function jalCal(jy){
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const gy = jy + 621;
  let leapJ = -14, jp = breaks[0], jump = 0;
  for(let i=1;i<breaks.length;i++){
    const jm = breaks[i];
    jump = jm - jp;
    if(jy < jm) break;
    leapJ = leapJ + jdiv(jump,33)*8 + jdiv(jmod(jump,33),4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + jdiv(n,33)*8 + jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33) === 4 && jump-n === 4) leapJ += 1;
  const leapG = jdiv(gy,4) - jdiv((jdiv(gy,100)+1)*3,4) - 150;
  const march = 20 + leapJ - leapG;
  if(jump - n < 6) n = n - jump + jdiv(jump+4,33)*33;
  let leap = jmod(jmod(n+1,33)-1,4);
  if(leap === -1) leap = 4;
  return {leap, gy, march};
}
function isLeapJalaali(jy){ return jalCal(jy).leap === 0; }
function j2d(jy,jm,jd){
  const r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - jdiv(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy;
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(gy,3,r.march);
  let k = jdn - jdn1f, jm, jd;
  if(k >= 0){
    if(k <= 185){ jm = 1 + jdiv(k,31); jd = jmod(k,31) + 1; return {jy,jm,jd}; }
    k -= 186;
  } else {
    jy -= 1; k += 179;
    if(r.leap === 1) k += 1;
  }
  jm = 7 + jdiv(k,30); jd = jmod(k,30) + 1;
  return {jy,jm,jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function jMonthLength(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaali(jy)?30:29; }
function jAddMonths(jy,jm,n){
  let total = (jy*12 + (jm-1)) + n;
  return { jy: Math.floor(total/12), jm: (total%12)+1 };
}
function jToday(){ const now = new Date(); return toJalaali(now.getFullYear(), now.getMonth()+1, now.getDate()); }

/* =========================================================
   5) PAYMENT SCHEDULE ENGINE
========================================================= */
function generateSchedule(purchaseJ, installments, perInstallment, ruleType, intervalDays){
  const entries = [];
  if(ruleType === 'start_of_next_month'){
    for(let i=0;i<installments;i++){
      const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, i+1);
      entries.push({ jy:t.jy, jm:t.jm, jd:1, amount:perInstallment });
    }
  } else if(ruleType === 'monthly_fixed_day'){
    const day = purchaseJ.jd;
    for(let i=0;i<installments;i++){
      const t = jAddMonths(purchaseJ.jy, purchaseJ.jm, i+1);
      const clampedDay = Math.min(day, jMonthLength(t.jy,t.jm));
      entries.push({ jy:t.jy, jm:t.jm, jd:clampedDay, amount:perInstallment });
    }
  } else { // every_30_days OR custom_interval
    const step = ruleType === 'custom_interval' ? (intervalDays || 30) : 30;
    const jdn0 = j2d(purchaseJ.jy, purchaseJ.jm, purchaseJ.jd);
    for(let i=0;i<installments;i++){
      const j = d2j(jdn0 + step*(i+1));
      entries.push({ jy:j.jy, jm:j.jm, jd:j.jd, amount:perInstallment });
    }
  }
  return entries;
}

function buildCommitmentSchedule(c){
  const sched = generateSchedule(c.purchaseDate, c.installments, c.monthly, c.scheduleType, c.intervalDays);
  return sched.map((e,i) => Object.assign({}, e, { paid: i < c.paid }));
}

/* =========================================================
   6) DERIVED FINANCIAL CALCULATIONS
========================================================= */
function reliableMonthlyIncome(){
  return state.incomeSources.filter(s=>s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function variableMonthlyIncome(){
  return state.incomeSources.filter(s=>!s.fixed).reduce((sum,s)=>{
    const f = FREQUENCIES.find(x=>x.key===s.frequency);
    return sum + s.amount * (f ? f.factor : 1);
  },0);
}
function totalFixedExpenses(){
  return state.fixedExpenses.reduce((sum,e)=>sum+e.amount,0);
}
function cap(){
  return Math.round(reliableMonthlyIncome() * state.installmentCapPercent / 100);
}
function statusFromPercent(pct){
  if(pct > 100) return 'danger';
  if(pct > state.thresholds.safe) return pct > state.thresholds.caution ? 'danger' : 'caution';
  return 'safe';
}
function statusMeta(s){
  return { safe:{emoji:'🟢',label:'امن'}, caution:{emoji:'🟡',label:'احتیاط'}, danger:{emoji:'🔴',label:'پرریسک'} }[s];
}

// all schedule entries across active commitments (each with commitment ref)
function allEntries(includePending){
  const list = [];
  state.commitments.forEach(c=>{
    buildCommitmentSchedule(c).forEach(e=>{ if(!e.paid) list.push(e); });
  });
  if(includePending && state.pendingSimulation){
    generateSchedule(
      state.pendingSimulation.purchaseDate, state.pendingSimulation.installments,
      state.pendingSimulation.monthly, state.pendingSimulation.scheduleType, state.pendingSimulation.intervalDays
    ).forEach(e=>list.push(e));
  }
  return list;
}
function commitmentForMonth(jy,jm,includePending){
  return allEntries(includePending).filter(e=>e.jy===jy && e.jm===jm).reduce((s,e)=>s+e.amount,0);
}
function nextMonths(n){
  const t = jToday();
  const out = [];
  for(let i=0;i<n;i++){ out.push(jAddMonths(t.jy,t.jm,i)); }
  return out;
}

/* =========================================================
   7) SVG GAUGE
========================================================= */
function gaugeSVG(percent, trackColor){
  const p = Math.max(0, Math.min(100, percent));
  const r = 76, len = Math.PI*r;
  const offset = len * (1 - p/100);
  let color = '#7CE3B8';
  if(percent > state.thresholds.caution || percent > 100) color = '#F3A28E';
  else if(percent > state.thresholds.safe) color = '#F0C480';
  return `<svg viewBox="0 0 200 108">
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${trackColor}" stroke-width="13" stroke-linecap="round"/>
    <path d="M22 96 A ${r} ${r} 0 0 1 178 96" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${len}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}

          <span id="cap-val" style="font-size:20px; font-weight:800; color:var(--safe);">${fa(obDraft.capPercent)}٪</span>
          <span class="field-label" style="margin:0;">سقف اقساط</span>
        </div>
        <input type="range" min="10" max="70" step="5" value="${obDraft.capPercent}" id="cap-slider">
        <div class="muted num" style="font-size:12px; margin-top:10px;">سقف محاسبه‌شده: <b id="cap-amount"></b></div>

          <div><div class="field-label">🟡 احتیاط تا</div><input class="input num" type="number" id="th-caution" value="${obDraft.thresholds.caution}"></div>
        </div>
        <div class="muted" style="font-size:11.5px; margin-top:8px;">بیشتر از آستانه‌ی احتیاط = 🔴 پرریسک</div>
      </div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-next">بعدی</button>
      </div>`;
    function updateCapDisplay(){
      document.getElementById('cap-val').textContent = fa(obDraft.capPercent) + '٪';
      document.getElementById('cap-amount').textContent = toman(reliable * obDraft.capPercent / 100);
    }
    updateCapDisplay();
    document.getElementById('cap-slider').addEventListener('input', e=>{
      obDraft.capPercent = parseInt(e.target.value,10); updateCapDisplay();
    });
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-next').onclick = ()=>{
      obDraft.thresholds.safe = parseInt(document.getElementById('th-safe').value,10) || 30;
      obDraft.thresholds.caution = parseInt(document.getElementById('th-caution').value,10) || 40;
      obStep++; renderOnboarding();
    };
  }

  else if(obStep === 5){
    el.innerHTML = `${obDots()}
      <div class="step-title">تعهدات مالی فعلیت رو ثبت کن</div>
      <div class="step-sub">هر وام، قسط، چک یا بدهی که الان داری. اگه چیزی نداری، رد کن بریم داشبورد.</div>
      <div class="card mb18" id="cm-form"></div>
      <div id="cm-list"></div>
      <div class="step-actions">
        <button class="btn btn-ghost" id="ob-back" style="max-width:90px;">بازگشت</button>
        <button class="btn btn-primary" id="ob-finish">پایان و رفتن به داشبورد</button>
      </div>`;
    renderCommitmentForm(document.getElementById('cm-form'), (c)=>{
      obDraft.commitments.push(c); renderCmList();
    });
    function renderCmList(){
      document.getElementById('cm-list').innerHTML = obDraft.commitments.map(c=>{
        const t = COMMITMENT_TYPES.find(x=>x.key===c.type);
        return `<div class="list-row">
          <div class="emoji-badge">${t.emoji}</div>
          <div class="info"><div class="title">${c.name}</div><div class="sub">${fa(c.paid)}/${fa(c.installments)} قسط · ${toman(c.monthly)}</div></div>
          <button class="row-del" data-del="${c.id}">✕</button>
        </div>`;
      }).join('') || `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0 14px;">هنوز تعهدی اضافه نکردی</div>`;
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        obDraft.commitments = obDraft.commitments.filter(x=>x.id!==b.dataset.del);
        renderCmList();
      });
    }
    renderCmList();
    document.getElementById('ob-back').onclick = ()=>{ obStep--; renderOnboarding(); };
    document.getElementById('ob-finish').onclick = ()=>{
      state.incomeSources = obDraft.incomeSources;
      state.fixedExpenses = obDraft.fixedExpenses;
      state.technique = obDraft.technique;
      state.installmentCapPercent = obDraft.capPercent;
      state.thresholds = obDraft.thresholds;
      state.commitments = obDraft.commitments;
      state.onboarded = true;
      saveState();
      document.getElementById('bottom-nav').style.display = 'flex';
      goTo('home');
    };
  }
}

  container.innerHTML = `

    </div>
    <div class="row-2 mb14">
      <div><div class="field-label">مبلغ کل</div><input class="input num" id="cf-total" inputmode="numeric" placeholder="۴٬۰۰۰٬۰۰۰"></div>
      <div><div class="field-label">تعداد اقساط</div><input class="input num" id="cf-installments" type="number" value="4"></div>

    <div class="row-2 mb14">
      <div><div class="field-label">اقساط پرداخت‌شده</div><input class="input num" id="cf-paid" type="number" value="0"></div>
      <div><div class="field-label">تاریخ خرید/شروع</div><input class="input date-field" id="cf-date" type="date" value="${isoToday}"></div>
    </div>
    <div class="field-label">سرویس / نوع زمان‌بندی</div>
    <select class="input mb14" id="cf-provider">
      ${PROVIDERS.map(p=>`<option value="${p.key}">${p.label} — ${SCHEDULE_LABELS[p.rule]}</option>`).join('')}
    </select>
    <div id="cf-interval-wrap" style="display:none;" class="mb14">
      <div class="field-label">فاصله بین اقساط (روز)</div>
      <input class="input num" id="cf-interval" type="number" value="30">
    </div>
    <div class="field-label">ضرورت</div>
    <div class="chip-grid mb14" id="cf-necessity">
      ${NECESSITY.map(n=>`<div class="chip" data-nec="${n.key}">${n.label}</div>`).join('')}
    </div>
    <button class="btn btn-ghost" id="cf-add">+ افزودن تعهد</button>
  `;
  let selType = 'bnpl', selNec = 'req';
  container.querySelectorAll('[data-type]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selType = c.dataset.type;
  });
  container.querySelectorAll('[data-nec]').forEach(c=>c.onclick=()=>{
    container.querySelectorAll('[data-nec]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selNec = c.dataset.nec;
  });
  container.querySelector('#cf-provider').addEventListener('change', e=>{
    const p = PROVIDERS.find(x=>x.key===e.target.value);
    container.querySelector('#cf-interval-wrap').style.display = p.rule==='custom_interval' ? 'block':'none';
  });
  container.querySelector('#cf-add').onclick = ()=>{
    const name = container.querySelector('#cf-name').value.trim();
    const total = parseFaNumber(container.querySelector('#cf-total').value);
    const installments = parseInt(container.querySelector('#cf-installments').value,10) || 1;
    const paid = Math.min(parseInt(container.querySelector('#cf-paid').value,10) || 0, installments);
    const dateStr = container.querySelector('#cf-date').value;
    const providerKey = container.querySelector('#cf-provider').value;
    const provider = PROVIDERS.find(p=>p.key===providerKey);
    const interval = parseInt(container.querySelector('#cf-interval').value,10) || 30;
    if(!name || !total){ showToast('نام و مبلغ کل رو وارد کن'); return; }
    const d = dateStr ? new Date(dateStr) : new Date();
    const purchaseDate = toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
    const monthly = Math.round(total / installments);
    onAdd({
      id: uid(), name, type: selType, total, installments, paid, monthly,
      provider: provider.label, scheduleType: provider.rule, intervalDays: interval,
      purchaseDate, necessity: selNec
    });
    container.querySelector('#cf-name').value=''; container.querySelector('#cf-total').value='';
  };
}

let commitFilter = 'all';
function renderCommitments(){
  const filters = [{key:'all',label:'همه'}].concat(COMMITMENT_TYPES.map(t=>({key:t.key,label:t.emoji+' '+t.label})));
  document.getElementById('commit-filters').innerHTML = filters.map(f=>
    `<div class="filter-chip ${commitFilter===f.key?'selected':''}" data-f="${f.key}">${f.label}</div>`).join('');
  document.querySelectorAll('#commit-filters [data-f]').forEach(el=>el.onclick=()=>{
    commitFilter = el.dataset.f; renderCommitments();
  });

  const list = state.commitments.filter(c => commitFilter==='all' ? true : c.type===commitFilter);
  const c = cap();
  document.getElementById('commit-list').innerHTML = list.map(cm=>{
    const t = COMMITMENT_TYPES.find(x=>x.key===cm.type);
    const nec = NECESSITY.find(n=>n.key===cm.necessity);
    const necClass = cm.necessity==='req'?'req':cm.necessity==='semi'?'semi':'optional';
    const schedule = buildCommitmentSchedule(cm);
    const remaining = schedule.filter(e=>!e.paid).length;
    const next = schedule.find(e=>!e.paid);
    const impactPct = c>0 ? Math.round((cm.monthly/c)*100) : 0;
    return `<div class="card" style="margin-bottom:12px; cursor:pointer;" data-open="${cm.id}">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="emoji-badge">${t.emoji}</div>
        <div class="info" style="flex:1;">
          <div class="title">${cm.name}</div>
          <div class="sub">${cm.provider} · ${fa(cm.installments-remaining)}/${fa(cm.installments)} قسط پرداخت‌شده</div>
        </div>
        <div style="text-align:left;">
          <div class="amount num">${toman(cm.monthly)}</div>
          <span class="badge-necessity ${necClass}">${nec.label}</span>
        </div>
      </div>
      <div class="schedule-list" id="sched-${cm.id}" style="display:none;">
        <div class="waterfall-row"><span class="l">مبلغ کل</span><span class="r num">${toman(cm.total)}</span></div>
        <div class="waterfall-row"><span class="l">اثر روی ظرفیت ماهانه</span><span class="r num">${fa(impactPct)}٪</span></div>
        <div class="waterfall-row"><span class="l">پرداخت بعدی</span><span class="r">${next ? fmtJDate(next) : '—'}</span></div>
        <div class="field-label" style="margin-top:10px;">همه‌ی اقساط</div>
        ${schedule.map((e,i)=>`<div class="schedule-item">
          <span class="${e.paid?'paid':''}">قسط ${fa(i+1)} — ${fmtJDate(e)}</span>
          <span class="num ${e.paid?'paid':''}">${fa(e.amount)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('') || `<div class="muted" style="text-align:center; padding:40px 0; font-size:13px;">تعهدی در این دسته نیست</div>`;

  document.querySelectorAll('[data-open]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const s = document.getElementById('sched-'+card.dataset.open);
      s.style.display = s.style.display==='none' ? 'block' : 'none';
    });
  });
}

function renderPlanCalendar(){
  const months = nextMonths(6);
  const income = reliableMonthlyIncome();
  const fixed = totalFixedExpenses();
  const savingsPct = state.technique.p.savings || 0;
  document.getElementById('plan-calendar').innerHTML = months.map(m=>{
    const installments = commitmentForMonth(m.jy,m.jm,false);
    const savings = Math.round(income*savingsPct/100);
    const available = Math.round(income - fixed - installments - savings);
    const dueEntries = allEntries(false).filter(e=>e.jy===m.jy && e.jm===m.jm).sort((a,b)=>a.jd-b.jd);
    return `<div class="cal-month-card">
      <div class="cal-month-head"><span class="name">${MONTH_NAMES[m.jm]} ${fa(m.jy)}</span>
        <span class="num" style="font-size:11px; color:var(--muted);">${toman(available)} آزاد</span></div>
      <div class="waterfall-row"><span class="l">درآمد</span><span class="r num">${toman(income)}</span></div>
      <div class="waterfall-row"><span class="l">هزینه ثابت</span><span class="r num">${toman(fixed)}</span></div>
      <div class="waterfall-row"><span class="l">اقساط</span><span class="r num">${toman(installments)}</span></div>
      <div class="waterfall-row"><span class="l">پس‌انداز</span><span class="r num">${toman(savings)}</span></div>
      ${dueEntries.length ? `<div class="field-label" style="margin-top:10px;">سررسیدها</div>` + dueEntries.map(e=>
        `<div class="cal-due-row"><span>${fa(e.jd)} ${MONTH_NAMES[e.jm]}</span><span class="num">${fa(e.amount)}</span></div>`).join('') : ''}

}

function renderPlanCashflow(){
  const t = jToday();

        <div class="amount num">${toman(s.amount)}</div>
        <button class="row-del" data-delinc="${s.id}">✕</button></div>`;
    }).join('') || `<div class="muted" style="font-size:12px; padding:8px 0;">هیچ منبعی ثبت نشده</div>`;
    document.querySelectorAll('[data-delinc]').forEach(b=>b.onclick=()=>{
      state.incomeSources = state.incomeSources.filter(s=>s.id!==b.dataset.delinc);
      saveState(); renderIncomeList();
    });
  }
  function renderFixedList(){
    document.getElementById('pf-fixed-list').innerHTML = state.fixedExpenses.map(e=>{
      const c = FIXED_CATEGORIES.find(x=>x.key===e.category);
      return `<div class="list-row"><div class="emoji-badge">${c.emoji}</div>
        <div class="info"><div class="title">${c.label}</div></div>
        <div class="amount num">${toman(e.amount)}</div>
        <button class="row-del" data-delfx="${e.id}">✕</button></div>`;
    }).join('') || `<div class="muted" style="font-size:12px; padding:8px 0;">هیچ هزینه‌ای ثبت نشده</div>`;
    document.querySelectorAll('[data-delfx]').forEach(b=>b.onclick=()=>{
      state.fixedExpenses = state.fixedExpenses.filter(e=>e.id!==b.dataset.delfx);
      saveState(); renderFixedList();
    });
  }
  renderIncomeList(); renderFixedList();

  document.getElementById('pf-add-income').onclick = ()=>{
    const name = prompt('نام منبع درآمد:'); if(!name) return;
    const amount = parseFaNumber(prompt('مبلغ (تومان):')); if(!amount) return;
    const fixed = confirm('این درآمد ثابت/قابل‌اتکاست؟ (Cancel = متغیره)');
    state.incomeSources.push({id:uid(), name, amount, frequency:'monthly', fixed});
    saveState(); renderIncomeList(); renderHome();
  };
  document.getElementById('pf-add-fixed').onclick = ()=>{
    const cat = prompt('دسته (rent, food, transport, bills, internet, insurance, tuition, subscriptions, family, other):','other');
    const found = FIXED_CATEGORIES.find(c=>c.key===cat) || FIXED_CATEGORIES.find(c=>c.key==='other');
    const amount = parseFaNumber(prompt('مبلغ ماهانه (تومان):')); if(!amount) return;
    state.fixedExpenses.push({id:uid(), category:found.key, amount});
    saveState(); renderFixedList(); renderHome();
  };

  function updateCapLabel(){
    document.getElementById('pf-cap-val').textContent = fa(document.getElementById('pf-cap-slider').value) + '٪';
  }
  updateCapLabel();
  document.getElementById('pf-cap-slider').addEventListener('input', updateCapLabel);

  document.getElementById('pf-save').onclick = ()=>{
    state.name = document.getElementById('pf-name').value.trim() || state.name;
    state.installmentCapPercent = parseInt(document.getElementById('pf-cap-slider').value,10);
    state.thresholds.safe = parseInt(document.getElementById('pf-th-safe').value,10) || 30;
    state.thresholds.caution = parseInt(document.getElementById('pf-th-caution').value,10) || 40;
    state.technique.key = document.getElementById('pf-tech').value;
    state.technique.p = {
      needs: parseInt(document.getElementById('pf-p-needs').value,10)||0,
      wants: parseInt(document.getElementById('pf-p-wants').value,10)||0,
      savings: parseInt(document.getElementById('pf-p-savings').value,10)||0
    };
    saveState();
    showToast('تغییرات ذخیره شد ✅');
    goTo('home');
  };
  document.getElementById('pf-reset').onclick = ()=>{
    if(!confirm('همه‌ی اطلاعات پاک بشه و از اول شروع کنیم؟')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    location.reload();
  };
}

/* =========================================================
   14) SIMULATOR
========================================================= */
function renderSimStart(){
  const today = new Date().toISOString().slice(0,10);
  const el = document.getElementById('sim-content');
  el.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" data-nav="home"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#12261F" stroke-width="2" stroke-linecap="round"/></svg></div>
      <h2 style="font-size:17px;">قبل از خرید بررسی کن</h2>
    </div>
    <div class="field-label">قیمت کالا</div>
    <div class="card mb18" style="text-align:center;">
      <input class="input num" id="sm-price" inputmode="numeric" placeholder="۳٬۰۰۰٬۰۰۰"
        style="border:none; text-align:center; font-size:28px; font-weight:800; padding:6px;">
      <div class="muted" style="font-size:12px;">تومان</div>
    </div>
    <div class="field-label">تعداد اقساط</div>
    <div class="chip-grid mb18" id="sm-installments">
      ${[1,3,4,6,12].map(n=>`<div class="chip ${n===4?'selected':''}" data-n="${n}">${n===1?'نقدی':fa(n)+' قسط'}</div>`).join('')}
    </div>
    <div class="field-label">سرویس / زمان‌بندی</div>
    <select class="input mb14" id="sm-provider">
      ${PROVIDERS.map(p=>`<option value="${p.key}">${p.label} — ${SCHEDULE_LABELS[p.rule]}</option>`).join('')}
    </select>
    <div id="sm-interval-wrap" style="display:none;" class="mb18">
      <div class="field-label">فاصله بین اقساط (روز)</div>
      <input class="input num" id="sm-interval" type="number" value="30">
    </div>
    <div class="field-label">تاریخ خرید</div>
    <input class="input date-field mb18" id="sm-date" type="date" value="${today}">
    <div class="field-label">این خرید چقدر ضروریه؟</div>
    <div class="chip-grid mb22" id="sm-necessity">
      ${NECESSITY.map((n,i)=>`<div class="chip ${i===0?'selected':''}" data-nec="${n.key}">${n.label}</div>`).join('')}
    </div>
    <button class="btn btn-primary" id="sm-check">بررسی خرید</button>
  `;
  let selN = 4, selNec = 'req';
  el.querySelectorAll('[data-n]').forEach(c=>c.onclick=()=>{
    el.querySelectorAll('[data-n]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selN = parseInt(c.dataset.n,10);
  });
  el.querySelectorAll('[data-nec]').forEach(c=>c.onclick=()=>{
    el.querySelectorAll('[data-nec]').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selNec = c.dataset.nec;
  });
  document.getElementById('sm-provider').addEventListener('change', e=>{
    const p = PROVIDERS.find(x=>x.key===e.target.value);
    document.getElementById('sm-interval-wrap').style.display = p.rule==='custom_interval' ? 'block':'none';
  });
  document.getElementById('sm-check').onclick = ()=>{
    const price = parseFaNumber(document.getElementById('sm-price').value);
    if(!price){ showToast('قیمت کالا رو وارد کن'); return; }
    const providerKey = document.getElementById('sm-provider').value;
    const provider = PROVIDERS.find(p=>p.key===providerKey);
    const interval = parseInt(document.getElementById('sm-interval').value,10) || 30;
    const dateStr = document.getElementById('sm-date').value;
    const d = dateStr ? new Date(dateStr) : new Date();
    const purchaseDate = toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
    const monthly = selN===1 ? 0 : Math.round(price/selN);
    state.pendingSimulation = {
      price, installments: selN, monthly, provider: provider.label,
      scheduleType: selN===1 ? null : provider.rule, intervalDays: interval,
      purchaseDate, necessity: selNec
    };
    renderSimResult();
  };
}

function renderSimResult(){
  const p = state.pendingSimulation;
  const el = document.getElementById('sim-content');
  const isCash = p.installments === 1;
  const c = cap();

  let scheduleEntries = [];
  let worst = { pct:0, jy:0, jm:0, val:0 };
  if(!isCash){
    scheduleEntries = generateSchedule(p.purchaseDate, p.installments, p.monthly, p.scheduleType, p.intervalDays);
    const months = nextMonths(Math.max(6, p.installments+1));
    months.forEach(m=>{
      const existing = commitmentForMonth(m.jy,m.jm,false);
      const withNew = scheduleEntries.filter(e=>e.jy===m.jy&&e.jm===m.jm).reduce((s,e)=>s+e.amount,0);
      const total = existing + withNew;
      const pct = c>0 ? (total/c)*100 : 0;
      if(pct > worst.pct) worst = { pct, jy:m.jy, jm:m.jm, val: total };
    });
  }
  const status = isCash ? 'safe' : statusFromPercent(worst.pct);
  const sm = statusMeta(status);
  const necLabel = NECESSITY.find(n=>n.key===p.necessity).label;
  const necClass = p.necessity==='req'?'req':p.necessity==='semi'?'semi':'optional';

  el.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" id="sm-back"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#12261F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 style="font-size:17px;">نتیجه بررسی</h2>
    </div>

    <div class="card mb18" style="text-align:center; background:${status==='safe'?'var(--safe-soft)':status==='caution'?'var(--caution-soft)':'var(--danger-soft)'}; border:none;">
      <div style="font-size:30px; margin-bottom:6px;">${isCash?'🟢':sm.emoji}</div>
      <div style="font-size:17px; font-weight:800; color:${status==='safe'?'var(--safe)':status==='caution'?'var(--caution)':'var(--danger)'}; margin-bottom:5px;">
        ${isCash ? 'خرید امن' : (status==='safe'?'خرید امن':status==='caution'?'خرید با احتیاط':'فشار مالی بالا')}
      </div>
      <div class="muted" style="font-size:12.5px; line-height:1.7;">
        ${isCash ? 'این خرید نقدی است و تعهد اقساطی جدیدی ایجاد نمی‌کند.' :
          `پرفشارترین ماه، ${MONTH_NAMES[worst.jm]} است — ${fa(Math.round(worst.pct))}٪ از سقف آن ماه.`}
      </div>
      <span class="badge-necessity ${necClass}" style="margin-top:10px; display:inline-block;">${necLabel}</span>
    </div>

    ${!isCash ? `
    <div class="card mb18">
      <div class="waterfall-row"><span class="l">قسط ماهانه</span><span class="r num">${toman(p.monthly)}</span></div>
      <div class="waterfall-row"><span class="l">سقف اقساط</span><span class="r num">${toman(c)}</span></div>
      <div class="waterfall-row"><span class="l">سرویس / زمان‌بندی</span><span class="r">${SCHEDULE_LABELS[p.scheduleType]}</span></div>
    </div>

    <div class="section-title">زمان‌بندی اقساط</div>
    <div class="card mb18">
      ${scheduleEntries.map((e,i)=>`<div class="schedule-item"><span>قسط ${fa(i+1)} — ${fmtJDate(e)}</span><span class="num">${fa(e.amount)}</span></div>`).join('')}
    </div>

    <div class="section-title">اثر روی ماه‌های آینده</div>
    <div class="month-strip mb18">
      ${nextMonths(4).map(m=>{
        const existing = commitmentForMonth(m.jy,m.jm,false);
        const withNew = scheduleEntries.filter(e=>e.jy===m.jy&&e.jm===m.jm).reduce((s,e)=>s+e.amount,0);
        const total = existing+withNew;
        const pct = c>0 ? Math.min(100,(total/c)*100) : 0;
        const s2 = statusFromPercent(pct);
        const color = s2==='safe'?'var(--safe)':s2==='caution'?'var(--caution)':'var(--danger)';
        return `<div class="month-pill"><div class="mname">${MONTH_NAMES[m.jm]}</div>
          <div class="mbar"><div class="mbar-fill" style="width:${pct}%; background:${color}"></div></div>
          <div class="mval num">${fa(total)}</div></div>`;
      }).join('')}
    </div>` : ''}

    <div class="step-actions">
      ${status==='danger' ? `
        <button class="btn btn-ghost" id="sm-cancel">منصرف شدم</button>
        <button class="btn btn-outline-danger" id="sm-confirm">ادامه خرید</button>
      ` : `
        <button class="btn btn-primary" id="sm-confirm">ادامه خرید</button>
        <button class="btn btn-ghost" id="sm-cancel">منصرف شدم</button>
      `}
    </div>
  `;
  document.getElementById('sm-back').onclick = ()=>{ state.pendingSimulation=null; renderSimStart(); };
  document.getElementById('sm-cancel').onclick = ()=>{
    state.pendingSimulation = null; showToast('خرید ثبت نشد'); goTo('home');
  };
  document.getElementById('sm-confirm').onclick = ()=>{
    if(!isCash){
      state.commitments.unshift({
        id: uid(), name:'خرید جدید', type:'bnpl', total:p.price, installments:p.installments, paid:0,
        monthly:p.monthly, provider:p.provider, scheduleType:p.scheduleType, intervalDays:p.intervalDays,
        purchaseDate:p.purchaseDate, necessity:p.necessity
      });
    }
    state.pendingSimulation = null;
    saveState();
    showToast('خرید با موفقیت ثبت شد ✅');
    goTo('commitments');
  };
}

/* =========================================================
   15) INIT
========================================================= */
loadState();
if(state.onboarded){
  document.getElementById('bottom-nav').style.display = 'flex';
  goTo('home');
} else {
  renderOnboarding();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
